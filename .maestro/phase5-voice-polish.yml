appId: team.whispr.mobile
---
- launchApp
- tapOn:
    text: "http://10.0.2.2:8081"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "http://.*:8081"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "Reload"
    commands:
      - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: "mobile-bottom-tab-settings"
    timeout: 60000
- openLink: "whispr://settings"
- extendedWaitUntil:
    visible:
      id: "mobile-settings-screen"
    timeout: 60000
- runFlow:
    file: "helpers/login-uat.yml"

# Synchronize the user-granted camera permission into the in-app media state.
- openLink: "whispr://settings"
- tapOn:
    id: "mobile-settings-open-notifications"
- extendedWaitUntil:
    visible:
      id: "mobile-settings-notifications"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "mobile-settings-permission-action-camera"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "mobile-settings-permission-action-camera"
- pressKey: BACK
- extendedWaitUntil:
    visible:
      id: "mobile-settings-screen"
    timeout: 15000

# Establish light theme before entering the room.
- openLink: "whispr://settings"
- tapOn:
    id: "mobile-settings-open-appearance"
- assertVisible:
    id: "mobile-settings-appearance"
- tapOn: "Açık|Light"
- pressKey: BACK
- tapOn:
    id: "mobile-bottom-tab-overview"
- extendedWaitUntil:
    visible:
      id: "mobile-workspace-channel-voice|mobile-voice-channel-screen"
    timeout: 30000

# Join a real voice channel and exercise microphone/camera without capturing active video.
- runFlow:
    when:
      visible:
        id: "mobile-workspace-channel-voice"
    commands:
      - tapOn:
          id: "mobile-workspace-channel-voice"
          index: 0
- extendedWaitUntil:
    visible:
      id: "mobile-voice-channel-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "mobile-voice-mute-toggle"
    timeout: 30000
- tapOn:
    id: "mobile-voice-mute-toggle"
- tapOn:
    id: "mobile-voice-mute-toggle"
- tapOn:
    id: "mobile-voice-camera-toggle"
- extendedWaitUntil:
    visible:
      id: "mobile-voice-camera-grid"
    timeout: 30000
- tapOn:
    id: "mobile-voice-camera-toggle"
- extendedWaitUntil:
    notVisible:
      id: "mobile-voice-camera-grid"
    timeout: 15000

# Device enumeration and noise preference stay on bounded IDs; no values are captured.
- tapOn:
    id: "mobile-voice-settings-open-control"
- assertVisible:
    id: "mobile-voice-device-sheet-panel"
- tapOn:
    id: "mobile-voice-device-refresh"
- tapOn:
    id: "mobile-voice-audio-input-.*"
    index: 0
    optional: true
- tapOn:
    id: "mobile-voice-audio-output-.*"
    index: 0
    optional: true
- tapOn:
    id: "mobile-voice-noise-toggle"
- tapOn:
    id: "mobile-voice-noise-toggle"
- pressKey: BACK
- assertVisible:
    id: "mobile-voice-channel-screen"
- takeScreenshot: "artifacts/mobile/phase5/light-voice-polish"

# Keep the room connected while proving the dark surface; camera remains off.
- pressKey: BACK
- openLink: "whispr://settings"
- tapOn:
    id: "mobile-settings-open-appearance"
- tapOn: "Koyu|Dark"
- pressKey: BACK
- tapOn:
    id: "mobile-bottom-tab-overview"
- extendedWaitUntil:
    visible:
      id: "mobile-workspace-channel-voice|mobile-voice-channel-screen"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "mobile-workspace-channel-voice"
    commands:
      - tapOn:
          id: "mobile-workspace-channel-voice"
          index: 0
- extendedWaitUntil:
    visible:
      id: "mobile-voice-channel-screen"
    timeout: 30000
- assertNotVisible:
    id: "mobile-voice-camera-grid"
- takeScreenshot: "artifacts/mobile/phase5/dark-voice-polish"

# Leave LiveKit cleanly before validating the app-wide network state.
- tapOn:
    id: "mobile-voice-leave"
- extendedWaitUntil:
    visible:
      id: "mobile-overview-screen"
    timeout: 30000

# Android-only deterministic network transition; always restore connectivity before finishing.
- runFlow:
    file: "helpers/phase5-offline-recovery.yml"
- extendedWaitUntil:
    visible:
      id: "mobile-overview-screen"
    timeout: 30000
