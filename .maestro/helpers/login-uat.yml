appId: team.whispr.mobile
---
- runFlow:
    when:
      visible:
        id: "mobile-settings-web-sign-in-action"
    commands:
      - tapOn:
          id: "mobile-settings-web-sign-in-action"
      - extendedWaitUntil:
          visible:
            id: "email"
          timeout: 15000
      - tapOn:
          id: "email"
      - eraseText: 100
      - inputText: ${MAESTRO_UAT_EMAIL}
      - tapOn:
          id: "password"
      - eraseText: 100
      - inputText: ${MAESTRO_UAT_PASSWORD}
      - hideKeyboard
      - tapOn: "Giris yap|Sign In"
- tapOn:
    id: "mobile-bottom-tab-settings"
- extendedWaitUntil:
    visible:
      id: "mobile-settings-sign-out-action"
    timeout: 30000
- tapOn:
    id: "mobile-bottom-tab-overview"
- extendedWaitUntil:
    visible:
      id: "mobile-overview-screen"
    timeout: 15000
