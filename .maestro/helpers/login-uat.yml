appId: team.whispr.mobile
---
- runFlow:
    when:
      visible:
        id: "mobile-settings-web-sign-in-action"
    commands:
      - tapOn:
          id: "mobile-bottom-tab-overview"
      - extendedWaitUntil:
          visible:
            id: "mobile-auth-screen"
          timeout: 15000
      - tapOn: "Dev hesabini doldur|Fill dev account"
      - tapOn: "Giris yap|Sign in"
      - extendedWaitUntil:
          visible:
            id: "mobile-overview-screen"
          timeout: 30000
- extendedWaitUntil:
    visible:
      id: "mobile-bottom-tab-settings"
    timeout: 30000
- tapOn:
    id: "mobile-bottom-tab-settings"
- extendedWaitUntil:
    visible:
      id: "mobile-settings-screen"
    timeout: 30000
- tapOn:
    id: "mobile-settings-open-account"
- extendedWaitUntil:
    visible:
      id: "mobile-settings-account"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "mobile-settings-sign-out-action"
    timeout: 30000
- pressKey: BACK
- extendedWaitUntil:
    visible:
      id: "mobile-settings-screen"
    timeout: 15000
- tapOn:
    id: "mobile-bottom-tab-overview"
- extendedWaitUntil:
    visible:
      id: "mobile-overview-screen"
    timeout: 15000
