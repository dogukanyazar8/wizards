appId: team.whispr.mobile
---
# Signed-in runs deliberately remain a no-op. Signed-out runs prove the
# native Login and required Turnstile surface without fabricating a session.
- runFlow:
    when:
      visible:
        id: "mobile-settings-web-sign-in-action"
    commands:
      - tapOn:
          id: "mobile-bottom-tab-overview"
      - extendedWaitUntil:
          visible:
            id: "mobile-auth-welcome-screen"
          timeout: 15000
      - tapOn:
          id: "mobile-auth-welcome-sign-in"
      - extendedWaitUntil:
          visible:
            id: "mobile-auth-login-screen"
          timeout: 15000
      - assertVisible:
          id: "mobile-auth-login-turnstile"
