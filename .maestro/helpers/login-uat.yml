appId: team.whispr.mobile
---
# Signed-in runs deliberately remain a no-op. The first signed-out branch
# normalizes Settings to Welcome; the second then proves the native Login
# surface without fabricating a session.
- runFlow:
    when:
      visible:
        id: "mobile-settings-web-sign-in-action"
    commands:
      - tapOn:
          id: "mobile-bottom-tab-overview"
      - extendedWaitUntil:
          visible:
            id: "mobile-auth-welcome-screen"
          timeout: 15000
- runFlow:
    when:
      visible:
        id: "mobile-auth-welcome-screen"
    commands:
      - tapOn:
          id: "mobile-auth-welcome-sign-in"
      - extendedWaitUntil:
          visible:
            id: "mobile-auth-login-screen"
          timeout: 15000
