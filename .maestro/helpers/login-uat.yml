appId: team.whispr.mobile
---
# Signed-in runs deliberately remain a no-op. The first signed-out branch
# normalizes Settings to the auth stack; the second then proves the native Login
# surface without fabricating a session.
# SPEC-GIRIS-KAYIT §6 — karsilama ekrani K4 ile kaldirildi; yigin kokü Login.
- runFlow:
    when:
      visible:
        id: "mobile-settings-web-sign-in-action"
    commands:
      - tapOn:
          id: "mobile-bottom-tab-overview"
      - extendedWaitUntil:
          visible:
            id: "mobile-auth-login-screen"
          timeout: 15000
- runFlow:
    when:
      visible:
        id: "mobile-auth-login-screen"
    commands:
      - assertVisible:
          id: "mobile-auth-login-register"
