appId: team.whispr.mobile
---
# Public settings deep link remains routable with predictive back enabled.
- openLink: "whispr://settings"
- assertVisible:
    id: "mobile-settings-screen"

# Channel deep link pushes a native stack screen and Android back pops it.
- openLink: "whispr://channels/${WHISPR_MOBILE_E2E_SERVER_ID}/${WHISPR_MOBILE_E2E_CHANNEL_ID}"
- assertVisible:
    id: "mobile-channel-chat-screen"
- pressKey: BACK
- assertVisible:
    id: "mobile-bottom-tab-overview"

# DM inbox pushes a native stack screen and Android back returns to the inbox.
- tapOn:
    id: "mobile-bottom-tab-messages"
- extendedWaitUntil:
    visible:
      id: "mobile-dm-conversation-row"
    timeout: 30000
- tapOn:
    id: "mobile-dm-conversation-row"
    index: 0
- assertVisible:
    id: "mobile-dm-chat-screen"
- pressKey: BACK
- assertVisible:
    id: "mobile-dm-inbox-screen"

# The validated DM deep link still resolves to its native stack screen.
- openLink: "whispr://channels/@me/${WHISPR_MOBILE_E2E_CONVERSATION_ID}"
- assertVisible:
    id: "mobile-dm-chat-screen"

# Invite commands still resolve safely to the signed-in product shell.
- openLink: "whispr://invite/PHASE1_PREDICTIVE_BACK_PROBE"
- assertVisible:
    id: "mobile-bottom-tab-overview"
