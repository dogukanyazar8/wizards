appId: team.whispr.mobile
---
# The anchor selects the dedicated UAT workspace, but it is not a benchmark
# target: deep links do not invoke the tap-time prefetch instrument.
- openLink: "whispr://channels/${MAESTRO_PERF_WORKSPACE_SERVER_ID}/${MAESTRO_PERF_WORKSPACE_ANCHOR_CHANNEL_ID}"
- extendedWaitUntil:
    visible:
      id: "mobile-channel-message-list"
    timeout: 30000
- openLink: "whispr://channels"
- extendedWaitUntil:
    visible:
      id: "mobile-overview-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ${MAESTRO_PERF_NETWORK_CHANNEL_NAME}
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "mobile-workspace-channel-text"
    containsChild:
      text: ${MAESTRO_PERF_NETWORK_CHANNEL_NAME}
- extendedWaitUntil:
    visible:
      id: "mobile-channel-message-list"
    timeout: 30000
- waitForAnimationToEnd
- pressKey: BACK
- extendedWaitUntil:
    visible:
      id: "mobile-overview-screen"
    timeout: 30000
