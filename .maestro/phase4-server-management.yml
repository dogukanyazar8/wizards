appId: team.whispr.mobile
---
# The flow creates and removes only its own named UAT server. It never assigns roles or kicks shared users.
- launchApp
- tapOn:
    text: "http://10.0.2.2:8081"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "http://.*:8081"
    index: 0
    optional: true
- extendedWaitUntil:
    visible:
      id: "mobile-bottom-tab-settings"
    timeout: 60000
- openLink: "whispr://settings"
- extendedWaitUntil:
    visible:
      id: "mobile-settings-screen"
    timeout: 60000
- runFlow:
    file: "helpers/login-uat.yml"
- openLink: "whispr://settings"
- tapOn:
    id: "mobile-settings-open-appearance"
- assertVisible:
    id: "mobile-settings-appearance"
- tapOn:
    id: "mobile-settings-appearance-control"
- tapOn: "Açık|Light"
- pressKey: BACK
- tapOn:
    id: "mobile-bottom-tab-overview"
- extendedWaitUntil:
    visible:
      id: "mobile-overview-screen"
    timeout: 30000
- tapOn:
    id: "mobile-server-add-open"
- assertVisible:
    id: "mobile-server-create-join-sheet-panel"
- tapOn:
    id: "mobile-server-mode-create"
- tapOn:
    id: "mobile-server-create-name"
- inputText: "Phase4 Maestro UAT"
- hideKeyboard
- tapOn:
    id: "mobile-server-create-submit"
- extendedWaitUntil:
    visible:
      id: "mobile-server-create-finish"
    timeout: 30000
- tapOn:
    id: "mobile-server-create-finish"
- extendedWaitUntil:
    visible: ".*: Phase4 Maestro UAT"
    timeout: 30000
- tapOn: ".*: Phase4 Maestro UAT"
- extendedWaitUntil:
    visible:
      id: "mobile-server-settings-open-.*"
    timeout: 30000
- tapOn:
    id: "mobile-server-invite-share-.*"
- extendedWaitUntil:
    visible: "Sharing link|Bağlantı paylaş"
    timeout: 30000
- pressKey: BACK
- extendedWaitUntil:
    visible:
      id: "mobile-overview-screen"
    timeout: 30000
# The native share chooser is closed before any evidence is captured.
- tapOn: ".*: Phase4 Maestro UAT"
- tapOn:
    id: "mobile-server-settings-open-.*"
- assertVisible:
    id: "mobile-server-settings-screen"
- assertVisible: "Phase4 Maestro UAT"
- tapOn:
    id: "mobile-category-create-open"
- assertVisible:
    id: "mobile-category-editor-sheet-panel"
- tapOn:
    id: "mobile-category-name"
- inputText: "Maestro"
- hideKeyboard
- tapOn:
    id: "mobile-category-save"
- tapOn:
    id: "mobile-channel-create-open"
- assertVisible:
    id: "mobile-channel-editor-sheet-panel"
- tapOn:
    id: "mobile-channel-name"
- inputText: "maestro-text"
- hideKeyboard
- tapOn:
    id: "mobile-channel-type-text"
- tapOn:
    id: "mobile-channel-save"
- tapOn:
    id: "mobile-server-members-open-.*"
- assertVisible:
    id: "mobile-server-members-screen"
- pressKey: BACK
- tapOn:
    id: "mobile-server-icon-picker"
- extendedWaitUntil:
    visible: "Photos|Fotoğraflar"
    timeout: 30000
- tapOn:
    point: "16%,58%"
- tapOn: "Done|Bitti|Tamam"
- extendedWaitUntil:
    visible:
      id: "mobile-server-settings-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Server settings saved.|Sunucu ayarları kaydedildi."
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "mobile-server-icon-picker"
    direction: UP
    timeout: 30000
- takeScreenshot: "artifacts/mobile/phase4/closure/light-server-management"
- openLink: "whispr://settings"
- tapOn:
    id: "mobile-settings-open-appearance"
- tapOn:
    id: "mobile-settings-appearance-control"
- tapOn: "Koyu|Dark"
- pressKey: BACK
- tapOn:
    id: "mobile-bottom-tab-overview"
- tapOn: ".*: Phase4 Maestro UAT"
- extendedWaitUntil:
    visible:
      id: "mobile-server-settings-open-.*"
    timeout: 30000
- tapOn:
    id: "mobile-server-settings-open-.*"
- assertVisible:
    id: "mobile-server-settings-screen"
- assertVisible: "Phase4 Maestro UAT"
- takeScreenshot: "artifacts/mobile/phase4/closure/dark-server-management"
- scrollUntilVisible:
    element:
      id: "mobile-server-delete-open"
    direction: DOWN
- tapOn:
    id: "mobile-server-delete-open"
- assertVisible:
    id: "mobile-server-delete-confirm-input"
- tapOn:
    id: "mobile-server-delete-confirm-input"
- inputText: "Phase4 Maestro UAT"
- hideKeyboard
- tapOn:
    id: "mobile-server-delete-confirm-confirm"
- extendedWaitUntil:
    visible:
      id: "mobile-overview-screen"
    timeout: 30000
- assertNotVisible: "Phase4 Maestro UAT"
