appId: team.whispr.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible:
        id: "mobile-auth-welcome-screen"
    commands:
      - tapOn:
          id: "mobile-auth-welcome-sign-in"
- extendedWaitUntil:
    visible:
      id: "mobile-auth-login-screen"
    timeout: 30000
- tapOn:
    id: "mobile-auth-login-email-input"
- inputText: ${MAESTRO_PERF_EMAIL}
- tapOn:
    id: "mobile-auth-login-password-input"
- inputText: ${MAESTRO_PERF_PASSWORD}
- hideKeyboard
- tapOn:
    id: "mobile-auth-login-submit"
- extendedWaitUntil:
    visible:
      id: "mobile-overview-screen"
    timeout: 30000
