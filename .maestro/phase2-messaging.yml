appId: team.whispr.mobile
---
- launchApp
- tapOn:
    text: "http://10.0.2.2:8081"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- runFlow:
    file: "helpers/login-uat.yml"
- openLink: "whispr://channels/${WHISPR_MOBILE_E2E_SERVER_ID}/${WHISPR_MOBILE_E2E_CHANNEL_ID}"
- assertVisible:
    id: "mobile-channel-chat-screen"
- tapOn:
    id: "mobile-channel-composer-input"
- inputText: "Phase2 Maestro verified"
- tapOn:
    id: "mobile-channel-send-button"
- extendedWaitUntil:
    visible: "Phase2 Maestro verified"
    timeout: 15000
- longPressOn:
    id: "mobile-message-actions-.*-trigger"
    containsChild:
      text: "Phase2 Maestro verified"
- tapOn: "Daha fazla emoji|More emoji"
- assertVisible:
    id: "mobile-message-emoji-picker-panel"
- tapOn: "😀"
- longPressOn:
    id: "mobile-message-actions-.*-trigger"
    containsChild:
      text: "Phase2 Maestro verified"
- tapOn: "Yanitla|Reply"
- assertVisible:
    id: "mobile-message-reply-preview"
- tapOn:
    id: "mobile-channel-composer-input"
- inputText: "Phase2 reply"
- tapOn:
    id: "mobile-channel-send-button"
- extendedWaitUntil:
    visible: "Phase2 reply"
    timeout: 15000
- longPressOn:
    id: "mobile-message-actions-.*-trigger"
    containsChild:
      text: "Phase2 Maestro verified"
- tapOn: "Diğer eylemler|More actions"
- tapOn: "Düzenle|Edit"
- assertVisible:
    id: "mobile-message-edit-preview"
- tapOn:
    id: "mobile-channel-composer-input"
- eraseText: 100
- inputText: "Phase2 edited verified"
- tapOn:
    id: "mobile-channel-send-button"
- extendedWaitUntil:
    visible: "Phase2 edited verified"
    timeout: 15000
- longPressOn:
    id: "mobile-message-actions-.*-trigger"
    containsChild:
      text: "Phase2 edited verified"
- tapOn: "Thread başlat|Start thread"
- assertVisible:
    id: "mobile-message-thread-screen"
- tapOn:
    id: "mobile-dm-composer-input"
- inputText: "Phase2 thread reply"
- tapOn:
    id: "mobile-dm-send-button"
- extendedWaitUntil:
    visible: "Phase2 thread reply"
    timeout: 15000
- takeScreenshot: "artifacts/mobile/phase2/closure/light-messaging"
- tapOn:
    id: "mobile-message-thread-back-button"
- longPressOn:
    id: "mobile-message-actions-.*-trigger"
    containsChild:
      text: "Phase2 edited verified"
- tapOn: "Diğer eylemler|More actions"
- tapOn: "Sil|Delete"
- tapOn: "Sil|Delete"
- assertNotVisible:
    id: "mobile-message-actions-.*-trigger"
    containsChild:
      text: "Phase2 edited verified"
- openLink: "whispr://settings"
- scrollUntilVisible:
    element:
      id: "mobile-settings-appearance-control"
    direction: DOWN
- tapOn:
    id: "mobile-settings-appearance-control"
- tapOn: "Koyu|Dark"
- openLink: "whispr://channels/${WHISPR_MOBILE_E2E_SERVER_ID}/${WHISPR_MOBILE_E2E_CHANNEL_ID}"
- takeScreenshot: "artifacts/mobile/phase2/closure/dark-messaging"
