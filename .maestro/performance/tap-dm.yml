appId: team.whispr.mobile
---
# Activate the real inbox first, then open the chat with the reader's own path.
# Inactive native-stack routes remain in the accessibility tree, so relying on
# a prior back flow can tap a hidden row while another screen is still active.
- openLink: "whispr://channels/@me"
- extendedWaitUntil:
    visible:
      id: "mobile-dm-inbox-screen"
    timeout: 15000
- tapOn:
    id: "mobile-dm-conversation-row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "mobile-dm-chat-screen"
    timeout: 15000
