appId: team.whispr.mobile
---
- launchApp:
    clearState: true
- openLink: "whispr://settings"
- extendedWaitUntil:
    visible:
      id: "mobile-settings-screen"
    timeout: 15000
- tapOn:
    id: "mobile-bottom-tab-overview"
- extendedWaitUntil:
    visible:
      id: "mobile-auth-welcome-screen"
    timeout: 15000

# Signed-out native navigation only. Do not enter credentials or submit a form.
- tapOn:
    id: "mobile-auth-welcome-sign-in"
- extendedWaitUntil:
    visible:
      id: "mobile-auth-login-screen"
    timeout: 15000
- assertVisible:
    id: "mobile-auth-login-turnstile"
- tapOn:
    id: "mobile-auth-login-forgot-password"
- extendedWaitUntil:
    visible:
      id: "mobile-auth-forgot-password-screen"
    timeout: 15000
- tapOn:
    id: "mobile-auth-forgot-back-to-sign-in"
- extendedWaitUntil:
    visible:
      id: "mobile-auth-login-screen"
    timeout: 15000
- tapOn:
    id: "mobile-auth-login-register"
- extendedWaitUntil:
    visible:
      id: "mobile-auth-register-screen"
    timeout: 15000
- tapOn:
    id: "mobile-auth-register-top-bar-back"
- extendedWaitUntil:
    visible:
      id: "mobile-auth-login-screen"
    timeout: 15000
- tapOn:
    id: "mobile-auth-login-top-bar-back"
- extendedWaitUntil:
    visible:
      id: "mobile-auth-welcome-screen"
    timeout: 15000
- tapOn:
    id: "mobile-auth-welcome-sign-up"
- extendedWaitUntil:
    visible:
      id: "mobile-auth-register-screen"
    timeout: 15000
- tapOn:
    id: "mobile-auth-register-top-bar-back"
- extendedWaitUntil:
    visible:
      id: "mobile-auth-welcome-screen"
    timeout: 15000
