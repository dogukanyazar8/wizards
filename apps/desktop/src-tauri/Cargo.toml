[package]
name = "whispr-desktop"
version = "0.8.1"
description = "Whispr desktop shell"
authors = ["Whispr"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "whispr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
url = "2"
