<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whispr Cihaz İzni</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <p aria-live="polite" id="global-status" role="status">Cihaz erişimi kontrol ediliyor…</p>
      <button id="retry" type="button" hidden>Yeniden dene</button>
    </main>
    <dialog
      aria-describedby="media-permission-description media-permission-trust"
      aria-labelledby="media-permission-title"
      id="media-permission-dialog"
    >
      <div class="media-permission-icon" id="media-permission-icon" aria-hidden="true">
        <svg
          id="camera-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="6" width="12" height="12" rx="3" />
          <path d="m15 10 6-3v10l-6-3" />
        </svg>
        <svg
          id="microphone-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          hidden
        >
          <rect x="9" y="2" width="6" height="13" rx="3" />
          <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8" />
        </svg>
      </div>
      <p class="eyebrow">Gizlilik</p>
      <h2 id="media-permission-title">Cihaz erişimi isteniyor</h2>
      <p id="media-permission-description"></p>
      <p class="media-permission-trust" id="media-permission-trust">
        Bu izin Whispr içindeki erişimi onaylar. Sisteminizin gizlilik ayarlarından da mikrofon veya
        kamera erişimine izin vermeniz gerekebilir.
      </p>
      <output aria-live="polite" class="result" id="media-permission-result"></output>
      <div class="actions media-permission-actions">
        <button class="secondary" id="media-permission-deny" type="button">Şimdi değil</button>
        <button id="media-permission-allow" type="button">İzin ver</button>
      </div>
    </dialog>
  </body>
</html>
