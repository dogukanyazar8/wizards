services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: wizards-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wizards
      POSTGRES_USER: wizards
      POSTGRES_PASSWORD: wizards
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 image stores data under /var/lib/postgresql/18/docker.
      # A new named volume prevents accidental reuse of a PostgreSQL 16 data directory.
      - postgres18_data:/var/lib/postgresql

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: wizards-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  clamav:
    image: clamav/clamav:1.5.4@sha256:9cb27d7660bdf66e9878c832cb433dd8aa152cfbe16f3c2c0084c80b04ae22b4
    container_name: wizards-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

  # Production/UAT use LiveKit Cloud. This configuration is local development only.
  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    container_name: wizards-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # The audio-level observer is the only source of `participant.isSpeaking`
      # for every client. LiveKit's defaults (400ms interval, smoothed over two
      # intervals) put the speaking ring most of a second behind the voice, so
      # the observer is tightened to keep the server-side signal in step with
      # the clients' own metering. Deployed LiveKit nodes need the same values.
      LIVEKIT_CONFIG: |
        audio:
          active_level: 35
          min_percentile: 40
          update_interval: 100
          smooth_intervals: 1
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  clamav_data:
  postgres18_data:
  redis_data:
