services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: wizards-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wizards
      POSTGRES_USER: wizards
      POSTGRES_PASSWORD: wizards
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 image stores data under /var/lib/postgresql/18/docker.
      # A new named volume prevents accidental reuse of a PostgreSQL 16 data directory.
      - postgres18_data:/var/lib/postgresql

  redis:
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    container_name: wizards-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  clamav:
    image: clamav/clamav:1.5.2@sha256:1b6443c4a7b456baa1abfaf9796815f8d21e2fb558dbaed5b682fd4552d8b0c3
    container_name: wizards-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

  livekit:
    image: livekit/livekit-server:v1.13.4@sha256:189f7c81b704a36642bc5c7e2d3e1ae83744627c11978a23a251bf19fbec64e0
    container_name: wizards-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # The audio-level observer is the only source of `participant.isSpeaking`
      # for every client. LiveKit's defaults (400ms interval, smoothed over two
      # intervals) put the speaking ring most of a second behind the voice, so
      # the observer is tightened to keep the server-side signal in step with
      # the clients' own metering. Deployed LiveKit nodes need the same values.
      LIVEKIT_CONFIG: |
        audio:
          active_level: 35
          min_percentile: 40
          update_interval: 100
          smooth_intervals: 1
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  clamav_data:
  postgres18_data:
  redis_data:
