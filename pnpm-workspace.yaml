packages:
  - apps/*
  - packages/*

catalog:
  "@typescript/native": npm:typescript@7.0.2
  typescript: npm:@typescript/typescript6@6.0.2

verifyDepsBeforeRun: false
strictDepBuilds: true

# image-size has no published fixed release for these two event-loop DoS
# advisories. The package is patched below and pressure-tested by
# scripts/quality/image-size-security.test.mjs, so audit ignores only the exact
# advisories covered by that local fix.
audit:
  ignore:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  "@xmldom/xmldom@0.8.13": 0.8.15
  "@xmldom/xmldom@0.9.10": 0.9.12
  brace-expansion@1.1.14: 5.0.12
  brace-expansion@2.1.0: 5.0.12
  brace-expansion@5.0.5: 5.0.12
  browserslist@4.28.2: 4.29.0
  decode-uri-component@0.2.2: 0.5.0
  deepmerge-ts: 8.0.2
  esbuild: 0.28.2
  effect: ^3.22.2
  engine.io@6.6.6: 6.6.10
  find-my-way: 9.9.0
  fast-uri@3.1.3: 3.1.6
  fast-uri@3.1.4: 3.1.6
  js-yaml@3.15.0: 3.15.2
  js-yaml@4.2.0: 4.3.2
  mysql2@3.15.3: 3.24.4
  nanoid@3.3.17: 3.3.18
  postcss: 8.5.28
  sharp@0.34.5: 0.35.4
  socket.io-parser@4.2.6: 4.2.7
  svix: ^1.92.2
  uuid: ^11.1.1
  valibot: 1.5.0
  ws@7.5.10: 7.5.11
  ws@8.18.3: 8.21.3
  ws@8.20.1: 8.21.3
  # GHSA-8988-4f7v-96qf: @prisma/instrumentation@5.22.0 pins @opentelemetry/core
  # to the ^1.22 line, whose newest release (1.30.1) is still vulnerable (no 1.x
  # backport was ever published). @sentry/nextjs already resolves the patched
  # 2.x line, so this override deduplicates both consumers onto the safe one.
  "@opentelemetry/core": ^2.11.0
  "@opentelemetry/resources": ^2.11.0
  "@opentelemetry/sdk-trace-base": ^2.11.0

packageExtensions:
  # Bind Next's React types to each consumer: web uses 19.3, Expo uses 19.2.
  "next@16.3.5":
    peerDependencies:
      "@types/react": ^19.2.18 || ^19.3.0
    peerDependenciesMeta:
      "@types/react":
        optional: true

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.6 || 2.10.13"
  - "@turbo/darwin-arm64@2.10.6 || 2.10.13"
  - "@turbo/linux-64@2.10.6 || 2.10.13"
  - "@turbo/linux-arm64@2.10.6 || 2.10.13"
  - "@turbo/windows-64@2.10.6 || 2.10.13"
  - "@turbo/windows-arm64@2.10.6 || 2.10.13"
  - turbo@2.10.6 || 2.10.13
  - "@hookform/resolvers@5.4.3"
  - "@expo/cli@57.0.14"
  - "@expo/fingerprint@0.20.7"
  - "@expo/inline-modules@0.1.5"
  - "@expo/local-build-cache-provider@57.0.6"
  - "@expo/metro-config@57.0.8"
  - "@expo/prebuild-config@57.0.11"
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-server@57.0.2
  - expo@57.0.12
  - expo-dev-client@57.0.11
  - expo-dev-launcher@57.0.11
  - expo-dev-menu@57.0.11
  - expo-image-manipulator@57.0.9
  - expo-image-picker@57.0.9
  - expo-notifications@57.0.10
  - expo-updates@57.0.13
  - jest-expo@57.0.4
  - nanoid@3.3.18
  - "@react-navigation/bottom-tabs@7.19.1"
  - "@react-navigation/core@7.22.1"
  - "@react-navigation/elements@2.9.42"
  - "@react-navigation/native-stack@7.19.1"
  - "@react-navigation/native@7.4.1"
  - babel-preset-expo@58.0.1
  - brace-expansion@5.0.12
  - browserslist@4.29.0

patchedDependencies:
  "@auth/core@0.41.3": patches/@auth__core@0.41.3.patch
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch
  image-size@1.2.1: patches/image-size@1.2.1.patch
  next-auth@5.0.0-beta.32: patches/next-auth@5.0.0-beta.32.patch
