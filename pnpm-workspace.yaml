packages:
  - apps/*
  - packages/*

verifyDepsBeforeRun: false

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver

overrides:
  brace-expansion@5.0.5: 5.0.6
  esbuild: 0.28.1
  effect: ^3.21.2
  js-yaml: 4.2.0
  postcss: ^8.5.13
  svix: ^1.92.2
  uuid: ^11.1.1
  ws@7.5.10: 7.5.11
  ws@8.18.3: 8.21.0
  ws@8.20.1: 8.21.0
  # GHSA-8988-4f7v-96qf: @prisma/instrumentation@5.22.0 pins @opentelemetry/core
  # to the ^1.22 line, whose newest release (1.30.1) is still vulnerable (no 1.x
  # backport was ever published). @sentry/nextjs already resolves the patched
  # 2.x line, so this override deduplicates both consumers onto the safe one.
  "@opentelemetry/core": ^2.8.0
  "@opentelemetry/resources": ^2.8.0
  "@opentelemetry/sdk-trace-base": ^2.8.0
