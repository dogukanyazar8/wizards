packages:
  - apps/*
  - packages/*

catalog:
  "@typescript/native": npm:typescript@7.0.2
  typescript: npm:@typescript/typescript6@6.0.2

verifyDepsBeforeRun: false
strictDepBuilds: true

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli@2.58.4 || 2.58.6": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  brace-expansion@1.1.14: 1.1.16
  brace-expansion@2.1.0: 2.1.2
  brace-expansion@5.0.5: 5.0.7
  esbuild: 0.28.1
  effect: ^3.21.2
  engine.io@6.6.6: 6.6.7
  fast-uri@3.1.3: 3.1.4
  js-yaml@4.2.0: 4.3.0
  postcss: 8.5.19
  sharp@0.34.5: 0.35.3
  svix: ^1.92.2
  uuid: ^11.1.1
  ws@7.5.10: 7.5.11
  ws@8.18.3: 8.21.0
  ws@8.20.1: 8.21.0
  # GHSA-8988-4f7v-96qf: @prisma/instrumentation@5.22.0 pins @opentelemetry/core
  # to the ^1.22 line, whose newest release (1.30.1) is still vulnerable (no 1.x
  # backport was ever published). @sentry/nextjs already resolves the patched
  # 2.x line, so this override deduplicates both consumers onto the safe one.
  "@opentelemetry/core": ^2.8.0
  "@opentelemetry/resources": ^2.8.0
  "@opentelemetry/sdk-trace-base": ^2.8.0

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.6"
  - "@turbo/darwin-arm64@2.10.6"
  - "@turbo/linux-64@2.10.6"
  - "@turbo/linux-arm64@2.10.6"
  - "@turbo/windows-64@2.10.6"
  - "@turbo/windows-arm64@2.10.6"
  - turbo@2.10.6
