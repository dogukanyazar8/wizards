packages:
  - apps/*
  - packages/*

verifyDepsBeforeRun: false

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver

overrides:
  brace-expansion@5.0.5: 5.0.6
  esbuild: 0.28.1
  effect: ^3.21.2
  js-yaml: 4.2.0
  postcss: ^8.5.13
  svix: ^1.92.2
  ws@7.5.10: 7.5.11
  ws@8.18.3: 8.21.0
  ws@8.20.1: 8.21.0
