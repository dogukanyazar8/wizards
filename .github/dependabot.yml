version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "uat"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    groups:
      npm-patch-and-minor:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "uat"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Istanbul"
    # Temporary pause: keep Dependabot security updates, but stop version-update PRs.
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
