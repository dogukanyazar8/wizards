name: CI

on:
  workflow_dispatch:
    inputs:
      e2e_scope:
        default: smoke
        description: Playwright E2E scope to run manually
        options:
          - api
          - smoke
          - realtime
          - full
        required: true
        type: choice
  schedule:
    - cron: "17 2 * * *"
  pull_request:
  push:
    branches:
      - main
      - staging
      - uat
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Static checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Test toolchain and workflow contracts
        run: pnpm test:toolchain

      - name: Check Playwright test discovery
        env:
          # Import-time Prisma configuration only; discovery does not connect to a database.
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/wizards_unit_tests
        run: pnpm --filter @wizards/web exec playwright test --list --reporter=line

      - name: Check E2E password guard
        run: node scripts/quality/e2e-password-guard.mjs

      - name: Dependency audit
        run: pnpm audit --audit-level moderate

      - name: Format
        env:
          PRETTIER_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test shared types package
        run: pnpm --filter @wizards/types test

      - name: Test shared UI package
        run: pnpm --filter @wizards/ui test

      - name: Build
        run: pnpm build

  web-tests:
    name: Web tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Test with coverage baseline
        env:
          LIVEKIT_URL: ws://127.0.0.1:7880
          WEB_COVERAGE_API_E2E: "0"
        timeout-minutes: 30
        # This uncached single-package gate needs live output, not Turbo's CI buffering.
        # Bound each test file as well as the whole coverage/report step.
        run: pnpm --filter @wizards/web test:coverage --test-concurrency=2 --test-timeout=120000

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: apps/web/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  mobile-quality:
    name: Mobile quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Install mobile visual Chromium
        run: pnpm --filter @wizards/mobile exec playwright install --with-deps chromium

      - name: Mobile quality gate
        env:
          WHISPR_MOBILE_ENV: development
        run: |
          pnpm --filter @wizards/mobile test
          pnpm --filter @wizards/mobile test:components
          pnpm --filter @wizards/mobile validate:env
          pnpm --filter @wizards/mobile release:check
          pnpm --filter @wizards/mobile quality:check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep scanner temporary files inside the job directory.
          TMPDIR: ${{ runner.temp }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download checksum-verified actionlint
        shell: bash
        run: |
          set -euo pipefail

          actionlintVersion=1.7.12
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          expectedSha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          archivePath="$RUNNER_TEMP/$archive"
          actionlintDirectory="$RUNNER_TEMP/actionlint"

          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "$archivePath"
          printf '%s  %s\n' "$expectedSha256" "$archivePath" | sha256sum --check --status
          mkdir --parents "$actionlintDirectory"
          tar --extract --file "$archivePath" --directory "$actionlintDirectory"
          "$actionlintDirectory/actionlint" -version

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint/actionlint" \
            -config-file .github/actionlint.yaml \
            -shellcheck= -pyflakes= .github/workflows/*.yml

  semgrep:
    name: Semgrep CE SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Semgrep CE 1.177.0, non-root multi-platform image. Digest upgrades require
      # repository rule tests plus a full scan; tag documents the reviewed CLI release.
      SEMGREP_IMAGE: semgrep/semgrep:1.177.0-nonroot@sha256:012c8fe81c14da2d7691b90fcd826ce07f460a3301442b16c460575c87d3efb6

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test repository Semgrep rules
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --oss-only \
              --metrics=off \
              --disable-version-check \
              --strict \
              --test \
              --config .semgrep/rules .semgrep/tests

      - name: Scan repository with Semgrep CE
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --oss-only \
              --metrics=off \
              --disable-version-check \
              --strict \
              --error \
              --no-rewrite-rule-ids \
              --max-lines-per-finding=5 \
              --timeout=10 \
              --timeout-threshold=1 \
              --config .semgrep/rules \
              --exclude=node_modules \
              --exclude=.next \
              --exclude=dist \
              --exclude=coverage \
              --exclude=packages/db/src/generated/prisma \
              --exclude=graphify-out \
              --exclude=target \
              --exclude=build \
              apps packages

  typescript-native-shadow:
    name: TypeScript Compiler Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript toolchain contracts
        run: pnpm test:toolchain

      - name: Run TypeScript 7 main typecheck
        run: pnpm typecheck:main:ci

      - name: Run TypeScript 6 compatibility typecheck
        env:
          # The full web project exceeds Node's default 2 GiB heap on hosted runners.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck:compat

      - name: Compare TS6 and TS7 declarations
        run: pnpm typecheck:declarations

      - name: Upload TypeScript compiler reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-compiler-${{ github.run_id }}
          path: artifacts/typescript/*.json
          if-no-files-found: error
          retention-days: 14

  node22-compatibility:
    name: Node 22 Compatibility
    # Keep this explicit: it validates the previous supported Node runtime without
    # running on scheduled CI or untrusted pull-request code.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 26 dependency installation runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Node.js 22 compatibility runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Verify Node.js native dependencies
        shell: bash
        run: |
          set -euo pipefail

          pnpm --filter @wizards/db db:generate
          pnpm --filter @wizards/web exec node --input-type=module -e "const { default: sharp } = await import('sharp'); await sharp({ create: { width: 1, height: 1, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } }).png().toBuffer();"
          pnpm --filter @wizards/web exec esbuild --version

      - name: Verify Tauri native toolchain
        shell: bash
        run: |
          set -euo pipefail

          pnpm --filter @wizards/desktop exec tauri --version
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  e2e-smoke:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e_scope == 'full')) && '[1,2]' || '[1]') }}

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: whispr_e2e
          POSTGRES_PASSWORD: wizards
          POSTGRES_USER: wizards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizards -d whispr_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.2-alpine@sha256:72cedd9603038893af961e90ac5e1a1a0d8377d5e338dbdad8fe284ea25de18f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_URL: http://127.0.0.1:3000
      AUTH_SECRET: whispr-e2e-auth-secret-change-me-local-only
      AUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://wizards:wizards@localhost:5432/whispr_e2e
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_DATABASE_URL: postgresql://wizards:wizards@localhost:5432/whispr_e2e
      E2E_TEST_MODE: "true"
      NEXT_PUBLIC_E2E_TEST_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXTAUTH_SECRET: whispr-e2e-auth-secret-change-me-local-only
      NEXTAUTH_URL: http://127.0.0.1:3000
      NODE_ENV: test
      REDIS_URL: redis://localhost:6379
      SOCKET_ALLOWED_ORIGINS: http://127.0.0.1:3000
      TOTP_SECRET_ENCRYPTION_ACTIVE_KEY_VERSION: v1
      TOTP_SECRET_ENCRYPTION_KEYS: '{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}'
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Generate E2E test password
        shell: bash
        run: |
          password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$password"
          echo "E2E_TEST_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply E2E migration history
        run: pnpm --filter @wizards/db db:migrate:deploy

      - name: Validate Playwright E2E environment
        run: pnpm --filter @wizards/web e2e:check-env

      - name: Install Playwright Chromium
        run: pnpm --filter @wizards/web exec playwright install --with-deps chromium

      - name: Run Playwright API tests
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_scope == 'api'
        run: pnpm --filter @wizards/web e2e e2e/specs/api

      - name: Run Playwright API and smoke tests
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.e2e_scope == 'smoke')
        run: pnpm --filter @wizards/web e2e e2e/specs/api e2e/specs/smoke

      - name: Run Playwright realtime and voice tests
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: pnpm --filter @wizards/web e2e e2e/specs/api e2e/specs/smoke e2e/specs/realtime e2e/specs/voice

      - name: Run Playwright API and realtime tests
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_scope == 'realtime'
        run: pnpm --filter @wizards/web e2e e2e/specs/api e2e/specs/realtime e2e/specs/voice

      # Screen share real media (K18): never on pull requests; branch pushes, the realtime
      # dispatch scope, and the nightly schedule. LiveKit is the docker-compose.yml image and
      # digest. The `services:` block must stay byte-identical across the four Playwright jobs
      # (governance contract), so the container starts here, only when this step will run.
      # Host networking has no port forwarder in front of LiveKit: its media sockets bind the
      # non-loopback addresses only, so the advertised 127.0.0.1 candidates must be backed by
      # `enable_loopback_candidate`, or every ICE check goes unanswered and the server drops
      # the participant with CONNECTION_TIMEOUT after 15 s.
      - name: Start LiveKit for real-media tests
        if: matrix.shard == 1 && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || (github.event_name == 'workflow_dispatch' && inputs.e2e_scope == 'realtime') || github.event_name == 'schedule')
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name whispr-livekit --network host \
            --env 'LIVEKIT_CONFIG=rtc: {enable_loopback_candidate: true}' \
            livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3 \
            --dev --bind 0.0.0.0 --node-ip 127.0.0.1
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7880/ >/dev/null; then
              echo "LiveKit is up after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 1
          done
          docker logs whispr-livekit || true
          echo "LiveKit did not answer on 7880." >&2
          exit 1

      - name: Run screen share real-media tests
        if: matrix.shard == 1 && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || (github.event_name == 'workflow_dispatch' && inputs.e2e_scope == 'realtime') || github.event_name == 'schedule')
        env:
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret
          LIVEKIT_URL: ws://127.0.0.1:7880
          NEXT_PUBLIC_E2E_VOICE_REAL_MEDIA: "true"
          NEXT_PUBLIC_LIVEKIT_URL: ws://127.0.0.1:7880
        run: pnpm --filter @wizards/web e2e:real-media

      - name: Run Playwright full suite
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e_scope == 'full')
        run: pnpm --filter @wizards/web e2e --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  e2e-cross-browser:
    name: Playwright Firefox/WebKit Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: whispr_e2e
          POSTGRES_PASSWORD: wizards
          POSTGRES_USER: wizards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizards -d whispr_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.2-alpine@sha256:72cedd9603038893af961e90ac5e1a1a0d8377d5e338dbdad8fe284ea25de18f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_URL: http://127.0.0.1:3000
      AUTH_SECRET: whispr-e2e-auth-secret-change-me-local-only
      AUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://wizards:wizards@localhost:5432/whispr_e2e
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_DATABASE_URL: postgresql://wizards:wizards@localhost:5432/whispr_e2e
      E2E_TEST_MODE: "true"
      NEXT_PUBLIC_E2E_TEST_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXTAUTH_SECRET: whispr-e2e-auth-secret-change-me-local-only
      NEXTAUTH_URL: http://127.0.0.1:3000
      NODE_ENV: test
      REDIS_URL: redis://localhost:6379
      SOCKET_ALLOWED_ORIGINS: http://127.0.0.1:3000
      TOTP_SECRET_ENCRYPTION_ACTIVE_KEY_VERSION: v1
      TOTP_SECRET_ENCRYPTION_KEYS: '{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}'
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Generate E2E test password
        shell: bash
        run: |
          password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$password"
          echo "E2E_TEST_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply E2E migration history
        run: pnpm --filter @wizards/db db:migrate:deploy

      - name: Validate Playwright E2E environment
        run: pnpm --filter @wizards/web e2e:check-env

      - name: Install Playwright Firefox and WebKit
        run: pnpm --filter @wizards/web exec playwright install --with-deps firefox webkit

      - name: Run Firefox and WebKit smoke tests
        run: pnpm --filter @wizards/web e2e:smoke:cross-browser

      - name: Upload cross-browser Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: playwright-cross-browser-report
          path: |
            apps/web/playwright-report
