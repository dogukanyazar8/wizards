            apps/web/test-results
          retention-days: 7

  e2e-visual:
    name: Playwright Visual Regression
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, wizards-ci]
    needs: verify
    timeout-minutes: 35

    services:
      postgres:
