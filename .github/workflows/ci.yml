  desktop-ops:
    name: Desktop Ops (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CARGO_AUDIT_VERSION: 0.22.2
      # Keep backtrace line numbers without the large full-debug GTK/Tauri artifacts.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      TAURI_WEB_URL: https://whispr.team
      TURBO_TELEMETRY_DISABLED: "1"
      WHISPR_DESKTOP_RELEASE_RING: uat
      WHISPR_DESKTOP_UPDATER_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record initial desktop disk space
        run: df -h .

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Resolve cargo-audit cache directory
        run: echo "CARGO_AUDIT_ROOT=$RUNNER_TOOL_CACHE/whispr-cargo-audit" >> "$GITHUB_ENV"

      - name: Restore cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_AUDIT_ROOT }}
          key: cargo-audit-ubuntu-24.04-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install and verify cargo-audit
        shell: bash
        run: |
          expected_version="cargo-audit $CARGO_AUDIT_VERSION"
          current_version=""
          if [ -x "$CARGO_AUDIT_ROOT/bin/cargo-audit" ]; then
            current_version="$("$CARGO_AUDIT_ROOT/bin/cargo-audit" --version)"
          fi
          if [ "$current_version" != "$expected_version" ]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --root "$CARGO_AUDIT_ROOT" --force
          fi
          test "$("$CARGO_AUDIT_ROOT/bin/cargo-audit" --version)" = "$expected_version"

      - name: Save cargo-audit binary
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_AUDIT_ROOT }}
          key: cargo-audit-ubuntu-24.04-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Audit Rust dependencies
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          "$CARGO_AUDIT_ROOT/bin/cargo-audit" audit --file Cargo.lock

      - name: Check Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check

      - name: Test Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Rust with Clippy
        run: pnpm --filter @wizards/desktop lint:rust

      # Debug checks are complete; retain release dependencies for the remaining builds.
      - name: Release debug build disk space
        working-directory: apps/desktop/src-tauri
        run: |
          df -h .
          cargo clean --profile dev
          df -h .

      - name: Test GLib security backport with optimizations
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --release --test glib_variant_security

      - name: Validate desktop release operations contract
        run: pnpm --filter @wizards/desktop release:ops

      - name: Run desktop script tests
        run: pnpm --filter @wizards/desktop test

      - name: Generate desktop production config
        run: pnpm --filter @wizards/desktop build:desktop:config

      - name: Build unsigned desktop native signal
        run: pnpm --filter @wizards/desktop build:desktop -- --no-bundle

      - name: Record final desktop disk space
        if: always()
        run: df -h .

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - quality
      - web-tests
      - mobile-quality
      - secret-scan
      - actionlint
      - semgrep
      - typescript-native-shadow
      - node22-compatibility
      - e2e-smoke
      - e2e-cross-browser
      - e2e-a11y
      - e2e-visual
      - desktop-ops
    steps:
      - name: Require successful checks
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          NODE22_REQUIRED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.REQUIRED_RESULTS);
          const required = ["quality", "web-tests", "mobile-quality", "secret-scan", "actionlint", "semgrep", "typescript-native-shadow", "e2e-smoke", "e2e-cross-browser", "e2e-a11y", "e2e-visual", "desktop-ops"];
          const failed = required.filter((id) => results[id]?.result !== "success");
          const compatibility = results["node22-compatibility"]?.result;
          if (compatibility !== "success" && !(compatibility === "skipped" && process.env.NODE22_REQUIRED === "false")) {
            failed.push("node22-compatibility");
          }
          if (failed.length) {
            console.error(`Required checks did not succeed: ${failed.join(", ")}`);
            process.exit(1);
          }
          console.log("All required CI checks passed.");
          NODE
