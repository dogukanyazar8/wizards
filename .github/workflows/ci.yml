  e2e-a11y:
    name: Playwright Accessibility Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: whispr_e2e
          POSTGRES_PASSWORD: wizards
          POSTGRES_USER: wizards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizards -d whispr_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.2-alpine@sha256:72cedd9603038893af961e90ac5e1a1a0d8377d5e338dbdad8fe284ea25de18f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_URL: http://127.0.0.1:3000
      AUTH_SECRET: whispr-e2e-auth-secret-change-me-local-only
      AUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://wizards:wizards@localhost:5432/whispr_e2e
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_DATABASE_URL: postgresql://wizards:wizards@localhost:5432/whispr_e2e
      E2E_TEST_MODE: "true"
      NEXT_PUBLIC_E2E_TEST_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXTAUTH_SECRET: whispr-e2e-auth-secret-change-me-local-only
      NEXTAUTH_URL: http://127.0.0.1:3000
      NODE_ENV: test
      REDIS_URL: redis://localhost:6379
      SOCKET_ALLOWED_ORIGINS: http://127.0.0.1:3000
      TOTP_SECRET_ENCRYPTION_ACTIVE_KEY_VERSION: v1
      TOTP_SECRET_ENCRYPTION_KEYS: '{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}'
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Generate E2E test password
        shell: bash
        run: |
          password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$password"
          echo "E2E_TEST_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply E2E migration history
        run: pnpm --filter @wizards/db db:migrate:deploy

      - name: Validate Playwright E2E environment
        run: pnpm --filter @wizards/web e2e:check-env

      - name: Install Playwright Chromium
        run: pnpm --filter @wizards/web exec playwright install --with-deps chromium

      - name: Test auth challenges, desktop OAuth and voice processing
        run: pnpm --filter @wizards/web exec node --test scripts/login-turnstile-browser.test.mjs scripts/oauth-handoff-browser.test.mjs scripts/desktop-oauth-claim.test.mjs scripts/settings-two-factor-browser.test.mjs scripts/trusted-device-actions.test.mjs scripts/trusted-device-browser.test.mjs scripts/voice-composer-browser.test.mjs scripts/voice-audio-renderer.test.mjs scripts/krisp-processor-browser.test.mjs scripts/voice-krisp-browser.test.mjs

      - name: Run accessibility scan
        run: pnpm --filter @wizards/web e2e:a11y

      - name: Upload accessibility Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: playwright-a11y-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

