name: CI

on:
  workflow_dispatch:
    inputs:
      e2e_scope:
        default: smoke
        description: Playwright E2E scope to run manually
        options:
          - smoke
          - full
        required: true
        type: choice
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Check E2E password guard
        run: |
          if grep -RE 'E2E_TEST_PASSWORD[[:space:]]*(\?\?|\|\|)|WhisprE2E!2026' apps/web/src apps/web/e2e; then
            echo "::error::Hardcoded E2E password fallback found"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level moderate

  e2e-smoke:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: whispr_e2e
          POSTGRES_PASSWORD: wizards
          POSTGRES_USER: wizards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizards -d whispr_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_URL: http://127.0.0.1:3000
      AUTH_SECRET: whispr-e2e-auth-secret-change-me-local-only
      AUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://wizards:wizards@localhost:5432/whispr_e2e
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_DATABASE_URL: postgresql://wizards:wizards@localhost:5432/whispr_e2e
      E2E_TEST_MODE: "true"
      NEXT_PUBLIC_E2E_TEST_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXTAUTH_SECRET: whispr-e2e-auth-secret-change-me-local-only
      NEXTAUTH_URL: http://127.0.0.1:3000
      REDIS_URL: redis://localhost:6379
      SOCKET_ALLOWED_ORIGINS: http://127.0.0.1:3000
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate E2E test password
        shell: bash
        run: |
          password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$password"
          echo "E2E_TEST_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Sync E2E database schema
        run: pnpm --filter @wizards/db exec prisma db push --schema prisma/schema.prisma --skip-generate

      - name: Install Playwright Chromium
        run: pnpm --filter @wizards/web exec playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        if: github.event_name != 'workflow_dispatch' || inputs.e2e_scope == 'smoke'
        run: pnpm --filter @wizards/web e2e:smoke

      - name: Run Playwright full suite
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_scope == 'full'
        run: pnpm --filter @wizards/web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
