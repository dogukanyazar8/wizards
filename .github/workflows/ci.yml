      - name: Generate E2E test password
        shell: bash
        run: |
          password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$password"
          echo "E2E_TEST_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply E2E migration history
        run: pnpm --filter @wizards/db db:migrate:deploy

      - name: Validate Playwright E2E environment
        run: pnpm --filter @wizards/web e2e:check-env

      - name: Install Playwright Firefox and WebKit
        run: pnpm --filter @wizards/web exec playwright install --with-deps firefox webkit

      - name: Run Firefox and WebKit smoke tests
        run: pnpm --filter @wizards/web e2e:smoke:cross-browser

      - name: Upload cross-browser Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          if-no-files-found: ignore
          name: playwright-cross-browser-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  e2e-a11y:
    name: Playwright Accessibility Scan
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, wizards-ci]
