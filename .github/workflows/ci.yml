      - name: Install Playwright Chromium
        run: pnpm --filter @wizards/web exec playwright install --with-deps chromium

      - name: Run accessibility scan
        run: pnpm --filter @wizards/web e2e:a11y

      - name: Upload accessibility Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: playwright-a11y-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  e2e-visual:
    name: Playwright Visual Regression
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: whispr_e2e
