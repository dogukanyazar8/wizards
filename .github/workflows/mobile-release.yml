name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected mobile release environment
        options:
          - uat
          - production
        required: true
        type: choice
      release_id:
        default: ""
        description: Published mobile Release id (OTA only; APK creates its release automatically)
        required: false
        type: string
      rollout:
        default: 100
        description: Deterministic OTA rollout percentage
        required: true
        type: number
      kind:
        description: Delivery layer to publish
        options:
          - ota
          - apk
        required: true
        type: choice
      preflight_only:
        default: false
        description: Validate the GitHub-hosted runner without publishing
        required: true
        type: boolean
      version:
        default: ""
        description: Required semantic version for APK publication
        required: false
        type: string

concurrency:
  group: mobile-release-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Verify GitHub-hosted release runner toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Require UAT dispatch
        shell: bash
        env:
          VALUE_GITHUB_REF_NAME: ${{ github.ref_name }}
          VALUE_INPUTS_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "${VALUE_GITHUB_REF_NAME}" == "uat" ]] || {
            echo "::error::Mobile release jobs may only run from the uat branch."
            exit 1
          }
          [[ "${VALUE_INPUTS_ENVIRONMENT}" == "uat" ]] || {
            echo "::error::The release workflow is authorized only for mobile-uat."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify GitHub-hosted release runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tool in bash git curl jq openssl base64 sha256sum stat sed awk grep find gpg unzip yes flock df; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::GitHub-hosted mobile release runner is missing: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Prepare hosted Android storage
        run: bash .github/scripts/prepare-hosted-android.sh

      - name: Setup JDK for Android SDK tools
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Provision Android build toolchain
        shell: bash
        run: bash .github/scripts/setup-android-build-tools.sh

      - name: Install verified job-local AWS CLI
        shell: bash
        run: bash .github/scripts/setup-aws-cli.sh

      - name: Verify GitHub-hosted release runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          aws_version="$(aws --version 2>&1)"
          [[ "$aws_version" == aws-cli/2.27.41\ * ]] || {
            echo "::error::Pinned AWS CLI 2.27.41 is required; found $aws_version"
            exit 1
          }
          missing=()
          for tool in apksigner aapt cmake ninja; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          [[ -n "${ANDROID_NDK_HOME:-}" && -d "$ANDROID_NDK_HOME" ]] || missing+=("Android NDK")
          (( ${#missing[@]} == 0 )) || {
            printf '::error::Android local-build toolchain is missing: %s\n' "${missing[*]}"
            exit 1
          }
          runner_temp_available_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          [[ "$runner_temp_available_kb" =~ ^[0-9]+$ ]] || {
            echo "::error::Could not determine available space for RUNNER_TEMP."
            exit 1
          }
          {
            echo "### GitHub-hosted mobile release runner"
            echo "- AWS CLI: $aws_version"
            echo "- Android SDK: $ANDROID_HOME"
            echo "- Android NDK: $ANDROID_NDK_HOME"
            echo "- CMake: $(cmake --version | head -n 1)"
            echo "- RUNNER_TEMP available: $((runner_temp_available_kb / 1024 / 1024)) GiB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scrub mobile release material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- \
            "$RUNNER_TEMP/android-sdk-download" \
            "$RUNNER_TEMP/aws-cli" \
            "$RUNNER_TEMP/aws-cli-download"

  contract:
    name: Validate mobile release contract
    if: ${{ ! inputs.preflight_only }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      api_base_url: ${{ steps.contract.outputs.api_base_url }}
      bundle_key: ${{ steps.contract.outputs.bundle_key }}
      key_id: ${{ steps.contract.outputs.key_id }}
      latest_key: ${{ steps.contract.outputs.latest_key }}
      release_channel: ${{ steps.contract.outputs.release_channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate dispatch and immutable paths
        id: contract
        shell: bash
        env:
          VALUE_INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          VALUE_INPUTS_KIND: ${{ inputs.kind }}
          VALUE_INPUTS_RELEASE_ID: ${{ inputs.release_id }}
          VALUE_INPUTS_ROLLOUT: ${{ inputs.rollout }}
          VALUE_GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VALUE_GITHUB_SHA: ${{ github.sha }}
          VALUE_INPUTS_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node apps/mobile/scripts/mobile-release-workflow.mjs \
            --environment "${VALUE_INPUTS_ENVIRONMENT}" \
            --kind "${VALUE_INPUTS_KIND}" \
            --release-id "${VALUE_INPUTS_RELEASE_ID}" \
            --rollout "${VALUE_INPUTS_ROLLOUT}" \
            --run-number "${VALUE_GITHUB_RUN_NUMBER}" \
            --source-sha "${VALUE_GITHUB_SHA}" \
            --version "${VALUE_INPUTS_VERSION}"

      - name: Run release contract tests
        run: |
          node --test scripts/releases/*.test.mjs
          node --test apps/mobile/scripts/mobile-release-workflow.test.mjs
          node --test apps/mobile/scripts/publish-ota-bundle.test.mjs

  ota:
    name: Publish signed UAT OTA
    if: inputs.kind == 'ota' && inputs.environment == 'uat' && github.ref_name == 'uat'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: mobile-${{ inputs.environment }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      WHISPR_MOBILE_OTA_PRIVATE_KEY: ${{ secrets.WHISPR_MOBILE_OTA_PRIVATE_KEY }}
      WHISPR_RELEASE_PUBLISH_TOKEN: ${{ secrets.WHISPR_RELEASE_PUBLISH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Install verified job-local AWS CLI
        shell: bash
        run: bash .github/scripts/setup-aws-cli.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require OTA and R2 publication secrets
        shell: bash
        env:
          VALUE_INPUTS_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          missing=()
          [[ "${VALUE_INPUTS_ENVIRONMENT}" == "uat" ]] || missing+=("configured UAT trust root")
          [[ -n "${WHISPR_MOBILE_OTA_PRIVATE_KEY:-}" ]] || missing+=("WHISPR_MOBILE_OTA_PRIVATE_KEY")
          [[ -n "${WHISPR_RELEASE_PUBLISH_TOKEN:-}" ]] || missing+=("WHISPR_RELEASE_PUBLISH_TOKEN")
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${R2_ACCESS_KEY_ID:-}" ]] || missing+=("R2_ACCESS_KEY_ID")
          [[ -n "${R2_SECRET_ACCESS_KEY:-}" ]] || missing+=("R2_SECRET_ACCESS_KEY")
          [[ -n "${R2_BUCKET:-}" ]] || missing+=("R2_BUCKET")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Mobile OTA publication is not configured: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Export, fingerprint, and sign OTA bytes
        id: prepare
        shell: bash
        env:
          VALUE_NEEDS_CONTRACT_OUTPUTS_API_BASE_URL: ${{ needs.contract.outputs.api_base_url }}
          VALUE_NEEDS_CONTRACT_OUTPUTS_BUNDLE_KEY: ${{ needs.contract.outputs.bundle_key }}
          VALUE_NEEDS_CONTRACT_OUTPUTS_RELEASE_CHANNEL: ${{ needs.contract.outputs.release_channel }}
          VALUE_INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          VALUE_NEEDS_CONTRACT_OUTPUTS_KEY_ID: ${{ needs.contract.outputs.key_id }}
          VALUE_INPUTS_RELEASE_ID: ${{ inputs.release_id }}
          VALUE_INPUTS_ROLLOUT: ${{ inputs.rollout }}
          # Telemetry reports this as the build a sample came from; without it
          # every device percentile is unattributable to a release.
          EXPO_PUBLIC_WHISPR_BUILD_ID: ${{ github.sha }}
          WHISPR_MOBILE_BUILD_ID: ${{ github.sha }}
          WHISPR_MOBILE_ENV: ${{ inputs.environment }}
          WHISPR_MOBILE_OTA_ENABLED: "true"
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/mobile-ota-export"
          key_path="$RUNNER_TEMP/mobile-ota-private-key.pem"
          registration="$RUNNER_TEMP/mobile-ota-registration.json"
          uploads="$RUNNER_TEMP/mobile-ota-uploads.json"
          fingerprint="$RUNNER_TEMP/mobile-ota-fingerprint.json"
          umask 077
          printf '%s' "$WHISPR_MOBILE_OTA_PRIVATE_KEY" > "$key_path"
          trap 'rm -f "$key_path"' EXIT

          pnpm --filter @wizards/mobile exec expo export --platform android \
            --output-dir "$export_dir" --dump-assetmap
          pnpm --filter @wizards/mobile exec expo-updates fingerprint:generate \
            --platform android > "$fingerprint"
          runtime_version="$(node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!/^[a-f0-9]{64}$/.test(value.hash)) process.exit(2); process.stdout.write(value.hash)' "$fingerprint")"

          node apps/mobile/scripts/publish-ota-bundle.mjs --prepare \
            --admin-base-url "${VALUE_NEEDS_CONTRACT_OUTPUTS_API_BASE_URL}" \
            --bundle-key "${VALUE_NEEDS_CONTRACT_OUTPUTS_BUNDLE_KEY}" \
            --channel "${VALUE_NEEDS_CONTRACT_OUTPUTS_RELEASE_CHANNEL}" \
            --environment "${VALUE_INPUTS_ENVIRONMENT}" \
            --export-dir "$export_dir" \
            --key-id "${VALUE_NEEDS_CONTRACT_OUTPUTS_KEY_ID}" \
            --platform android \
            --private-key-path "$key_path" \
            --registration-out "$registration" \
            --release-id "${VALUE_INPUTS_RELEASE_ID}" \
            --rollout "${VALUE_INPUTS_ROLLOUT}" \
            --runtime-version "$runtime_version" \
            --uploads-out "$uploads"

          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); fs.writeFileSync(process.argv[2],value.payload.manifestBody)' \
            "$registration" "$RUNNER_TEMP/mobile-ota-manifest.json"
          jq -r '.payload.manifestSignature' "$registration" | base64 --decode > "$RUNNER_TEMP/mobile-ota-manifest.sig"
          openssl x509 -in apps/mobile/certs/ota/uat/certificate.pem -pubkey -noout > "$RUNNER_TEMP/mobile-ota-public.pem"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/mobile-ota-public.pem" \
            -signature "$RUNNER_TEMP/mobile-ota-manifest.sig" "$RUNNER_TEMP/mobile-ota-manifest.json"

          echo "registration=$registration" >> "$GITHUB_OUTPUT"
          echo "uploads=$uploads" >> "$GITHUB_OUTPUT"
          echo "runtime_version=$runtime_version" >> "$GITHUB_OUTPUT"

      - name: Publish immutable OTA assets to Cloudflare R2
        shell: bash
        env:
          VALUE_STEPS_PREPARE_OUTPUTS_UPLOADS: ${{ steps.prepare.outputs.uploads }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          endpoint_url="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          while IFS= read -r encoded; do
            row="$(printf '%s' "$encoded" | base64 --decode)"
            local_path="$(printf '%s' "$row" | jq -r '.localPath')"
            key="$(printf '%s' "$row" | jq -r '.key')"
            content_type="$(printf '%s' "$row" | jq -r '.contentType')"
            if aws --endpoint-url "$endpoint_url" s3api head-object \
              --bucket "$R2_BUCKET" --key "$key" >/dev/null 2>&1; then
              echo "::error::Immutable OTA key already exists: $key"
              exit 1
            fi
            aws --endpoint-url "$endpoint_url" s3 cp "$local_path" "s3://${R2_BUCKET}/${key}" \
              --content-type "$content_type" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress
          done < <(jq -r '.[] | @base64' "${VALUE_STEPS_PREPARE_OUTPUTS_UPLOADS}")

      - name: Register signed OTA metadata
        shell: bash
        env:
          VALUE_STEPS_PREPARE_OUTPUTS_REGISTRATION: ${{ steps.prepare.outputs.registration }}
          VALUE_NEEDS_CONTRACT_OUTPUTS_API_BASE_URL: ${{ needs.contract.outputs.api_base_url }}
          VALUE_INPUTS_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          jq '.payload' "${VALUE_STEPS_PREPARE_OUTPUTS_REGISTRATION}" > "$RUNNER_TEMP/mobile-ota-registration-body.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${WHISPR_RELEASE_PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/mobile-ota-registration-body.json" \
            "${VALUE_NEEDS_CONTRACT_OUTPUTS_API_BASE_URL}/api/v1/admin/releases/${VALUE_INPUTS_RELEASE_ID}/ota" \
            > "$RUNNER_TEMP/mobile-ota-registration-response.json"

      - name: Validate remote signed manifest and assets
        shell: bash
        env:
          VALUE_STEPS_PREPARE_OUTPUTS_RUNTIME_VERSION: ${{ steps.prepare.outputs.runtime_version }}
          VALUE_INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          VALUE_NEEDS_CONTRACT_OUTPUTS_KEY_ID: ${{ needs.contract.outputs.key_id }}
          VALUE_GITHUB_RUN_ID: ${{ github.run_id }}
          VALUE_NEEDS_CONTRACT_OUTPUTS_API_BASE_URL: ${{ needs.contract.outputs.api_base_url }}
          VALUE_STEPS_PREPARE_OUTPUTS_REGISTRATION: ${{ steps.prepare.outputs.registration }}
        run: |
          set -euo pipefail
          response_headers="$RUNNER_TEMP/mobile-ota-response.headers"
          response_body="$RUNNER_TEMP/mobile-ota-response.body"
          curl --fail-with-body --silent --show-error \
            -D "$response_headers" -o "$response_body" \
            -H "expo-protocol-version: 1" \
            -H "expo-platform: android" \
            -H "expo-runtime-version: ${VALUE_STEPS_PREPARE_OUTPUTS_RUNTIME_VERSION}" \
            -H "expo-channel-name: ${VALUE_INPUTS_ENVIRONMENT}" \
            -H "expo-expect-signature: sig, keyid=\"${VALUE_NEEDS_CONTRACT_OUTPUTS_KEY_ID}\", alg=\"rsa-v1_5-sha256\"" \
            -H "expo-installation-id: ci-${VALUE_GITHUB_RUN_ID}" \
            "${VALUE_NEEDS_CONTRACT_OUTPUTS_API_BASE_URL}/api/v1/app/updates/manifest"
          grep -qi 'expo-protocol-version: 1' "$response_headers"
          grep -qi 'expo-signature:' "$response_body"
          manifest_id="$(jq -r '.payload.id' "${VALUE_STEPS_PREPARE_OUTPUTS_REGISTRATION}")"
          grep -q "$manifest_id" "$response_body"
          jq -r '.payload.manifestBody | fromjson | [.launchAsset.url, (.assets[].url)] | .[]' \
            "${VALUE_STEPS_PREPARE_OUTPUTS_REGISTRATION}" |
            while IFS= read -r asset_url; do
              curl --fail --silent --show-error --head "$asset_url" >/dev/null
            done

      - name: Scrub mobile release material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'mobile-ota-*' -delete
          if [[ -d "$RUNNER_TEMP/mobile-ota-export" ]]; then
            rm -rf -- "$RUNNER_TEMP/mobile-ota-export"
          fi
          rm -rf -- "$RUNNER_TEMP/aws-cli" "$RUNNER_TEMP/aws-cli-download"

  apk:
    name: Build and publish internal Android APK
    if: inputs.kind == 'apk' && inputs.environment == 'uat' && github.ref_name == 'uat'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: mobile-${{ inputs.environment }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPO_PUBLIC_WHISPR_BUILD_ID: ${{ github.sha }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      WHISPR_MOBILE_BUILD_ID: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Prepare hosted Android storage
        run: bash .github/scripts/prepare-hosted-android.sh

      - name: Setup JDK for Android SDK tools
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Provision Android build toolchain
        shell: bash
        run: bash .github/scripts/setup-android-build-tools.sh

      - name: Install verified job-local AWS CLI
        shell: bash
        run: bash .github/scripts/setup-aws-cli.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies and pinned EAS CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/eas-cli" eas-cli@24.5.0
          echo "$RUNNER_TEMP/eas-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Require APK and R2 publication secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${EXPO_TOKEN:-}" ]] || missing+=("EXPO_TOKEN")
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${R2_ACCESS_KEY_ID:-}" ]] || missing+=("R2_ACCESS_KEY_ID")
          [[ -n "${R2_SECRET_ACCESS_KEY:-}" ]] || missing+=("R2_SECRET_ACCESS_KEY")
          [[ -n "${R2_BUCKET:-}" ]] || missing+=("R2_BUCKET")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Internal APK publication is not configured: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Record APK build disk start
        shell: bash
        run: |
          set -euo pipefail
          available_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          [[ "$available_kb" =~ ^[0-9]+$ ]] || {
            echo "::error::Could not determine available space for RUNNER_TEMP before APK build."
            exit 1
          }
          {
            echo "### APK build disk"
            echo "- Before build: $((available_kb / 1024 / 1024)) GiB available"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK locally with the existing EAS-managed Android credential
        id: build
        env:
          VALUE_INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          environment="${VALUE_INPUTS_ENVIRONMENT}"
          apk="$RUNNER_TEMP/mobile-release.apk"
          build_root="$RUNNER_TEMP/eas-local-build"
          build_log="$RUNNER_TEMP/eas-local-build.log"
          rm -rf -- "$build_root"
          rm -f -- "$build_log" "$apk"
          mkdir -p "$build_root/work" "$build_root/artifacts" "$build_root/tmp"
          export EAS_LOCAL_BUILD_WORKINGDIR="$build_root/work"
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$build_root/artifacts"
          export TMPDIR="$build_root/tmp"

          set +e
          eas build --platform android --profile "$environment" --local --non-interactive --freeze-credentials \
            --output "$apk" > "$build_log" 2>&1
          build_status="$?"
          set -e
          if (( build_status != 0 )); then
            grep -F '[RUN_GRADLEW]' "$build_log" \
              | tail -n 200 \
              | sed -E 's/[A-Za-z0-9+\/=]{80,}/[REDACTED]/g' >&2 || true
            echo "::error::Local EAS build failed; raw credential-bearing log was not published."
            exit "$build_status"
          fi
          rm -f -- "$build_log"
          [[ -s "$apk" ]] || { echo "::error::Local EAS build did not produce an APK."; exit 1; }
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Record APK build disk end
        if: always()
        shell: bash
        run: |
          set -u
          available_kb="$(df -Pk "$RUNNER_TEMP" 2>/dev/null | awk 'NR == 2 { print $4 }')"
          if [[ "$available_kb" =~ ^[0-9]+$ ]]; then
            echo "- After build: $((available_kb / 1024 / 1024)) GiB available" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not determine available space for RUNNER_TEMP after APK build."
          fi

      - name: Verify APK certificate and immutable metadata
        id: verify
        shell: bash
        env:
          VALUE_STEPS_BUILD_OUTPUTS_APK: ${{ steps.build.outputs.apk }}
          VALUE_INPUTS_VERSION: ${{ inputs.version }}
          VALUE_INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          VALUE_INPUTS_RELEASE_ID: ${{ inputs.release_id }}
          VALUE_INPUTS_ROLLOUT: ${{ inputs.rollout }}
          VALUE_GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VALUE_GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk="${VALUE_STEPS_BUILD_OUTPUTS_APK}"
          apksigner_path="$(command -v apksigner || true)"
          if [[ -z "$apksigner_path" && -n "${ANDROID_HOME:-}" ]]; then
            apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          fi
          [[ -x "$apksigner_path" ]] || { echo "::error::apksigner was not found."; exit 1; }
          aapt_path="$(command -v aapt || true)"
          if [[ -z "$aapt_path" && -n "${ANDROID_HOME:-}" ]]; then
            aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          fi
          [[ -x "$aapt_path" ]] || { echo "::error::aapt was not found."; exit 1; }
          package_line="$("$aapt_path" dump badging "$apk" | sed -n '/^package: /p' | head -n 1)"
          actual_version_code="$(printf '%s\n' "$package_line" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
          actual_version_name="$(printf '%s\n' "$package_line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          [[ "$actual_version_code" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::APK has no positive Android versionCode."
            exit 1
          }
          [[ "$actual_version_name" == "${VALUE_INPUTS_VERSION}" ]] || {
            echo "::error::APK versionName $actual_version_name does not match requested ${VALUE_INPUTS_VERSION}."
            exit 1
          }
          contract_json="$(
            node apps/mobile/scripts/mobile-release-workflow.mjs \
              --environment "${VALUE_INPUTS_ENVIRONMENT}" \
              --kind apk \
              --release-id "${VALUE_INPUTS_RELEASE_ID}" \
              --rollout "${VALUE_INPUTS_ROLLOUT}" \
              --run-number "${VALUE_GITHUB_RUN_NUMBER}" \
              --source-sha "${VALUE_GITHUB_SHA}" \
              --version "$actual_version_name" \
              --version-code "$actual_version_code"
          )"
          file_name="$(printf '%s' "$contract_json" | jq -r '.fileName')"
          [[ "$file_name" != "null" && -n "$file_name" ]] || {
            echo "::error::Final APK artifact name could not be generated."
            exit 1
          }
          certificate_output="$("$apksigner_path" verify --print-certs "$apk")"
          raw_fingerprint="$(printf '%s\n' "$certificate_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          [[ "$raw_fingerprint" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::APK signing certificate digest is missing."; exit 1; }
          signing_fingerprint="$(printf '%s' "$raw_fingerprint" | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          size_bytes="$(stat -c%s "$apk")"
          printf '%s  %s\n' "$sha256" "$file_name" > "$RUNNER_TEMP/${file_name}.sha256"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "signing_fingerprint=$signing_fingerprint" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"
          echo "version_name=$actual_version_name" >> "$GITHUB_OUTPUT"

      - name: Publish and remotely verify immutable APK
        shell: bash
        env:
          VALUE_STEPS_VERIFY_OUTPUTS_ARTIFACT_KEY: ${{ steps.verify.outputs.artifact_key }}
          VALUE_STEPS_BUILD_OUTPUTS_APK: ${{ steps.build.outputs.apk }}
          VALUE_STEPS_VERIFY_OUTPUTS_FILE_NAME: ${{ steps.verify.outputs.file_name }}
          VALUE_STEPS_VERIFY_OUTPUTS_SHA256: ${{ steps.verify.outputs.sha256 }}
          VALUE_STEPS_VERIFY_OUTPUTS_SIZE_BYTES: ${{ steps.verify.outputs.size_bytes }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          artifact_key="${VALUE_STEPS_VERIFY_OUTPUTS_ARTIFACT_KEY}"
          endpoint_url="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if aws --endpoint-url "$endpoint_url" s3api head-object \
            --bucket "$R2_BUCKET" --key "$artifact_key" >/dev/null 2>&1; then
            echo "::error::Immutable APK key already exists: $artifact_key"
            exit 1
          fi
          aws --endpoint-url "$endpoint_url" s3 cp "${VALUE_STEPS_BUILD_OUTPUTS_APK}" \
            "s3://${R2_BUCKET}/${artifact_key}" \
            --content-type "application/vnd.android.package-archive" \
            --cache-control "public, max-age=31536000, immutable" --no-progress
          aws --endpoint-url "$endpoint_url" s3 cp \
            "$RUNNER_TEMP/${VALUE_STEPS_VERIFY_OUTPUTS_FILE_NAME}.sha256" \
            "s3://${R2_BUCKET}/${artifact_key}.sha256" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable" --no-progress

          artifact_url="https://updates.whispr.team/${artifact_key}"
          remote_sha256="$(curl --fail --silent --show-error "$artifact_url" | sha256sum | awk '{print $1}')"
          [[ "$remote_sha256" == "${VALUE_STEPS_VERIFY_OUTPUTS_SHA256}" ]] || {
            echo "::error::Published APK SHA-256 does not match the verified build."
            exit 1
          }
          head_headers="$RUNNER_TEMP/mobile-apk-head.headers"
          curl --fail --silent --show-error --head --dump-header "$head_headers" \
            --output /dev/null "$artifact_url"
          remote_size="$(awk 'tolower($1) == "content-length:" { gsub("\r", "", $2); print $2 }' \
            "$head_headers" | tail -n 1)"
          [[ "$remote_size" == "${VALUE_STEPS_VERIFY_OUTPUTS_SIZE_BYTES}" ]] || {
            echo "::error::Published APK Content-Length does not match the verified build."
            exit 1
          }
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Range: bytes=0-1023' "$artifact_url")"
          [[ "$status" == "206" ]] || { echo "::error::APK host did not preserve Range requests."; exit 1; }

      - name: Prepare verified APK publication
        env:
          RELEASE_VERSION: ${{ steps.verify.outputs.version_name }}
          ARTIFACT_KEY: ${{ steps.verify.outputs.artifact_key }}
          ARTIFACT_SHA256: ${{ steps.verify.outputs.sha256 }}
          ARTIFACT_CERT_SHA256: ${{ steps.verify.outputs.signing_fingerprint }}
          ARTIFACT_SIZE: ${{ steps.verify.outputs.size_bytes }}
          ARTIFACT_VERSION_CODE: ${{ steps.verify.outputs.version_code }}
        run: node scripts/releases/prepare-publication.mjs android "$RUNNER_TEMP/mobile-publication.json"

      - name: Save retryable publication manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-publication
          path: ${{ runner.temp }}/mobile-publication.json
          if-no-files-found: error
          retention-days: 30

      - name: Scrub mobile release material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP" -maxdepth 1 -type f \
            \( -name 'mobile-apk-*' -o -name 'mobile-latest.json' \
            -o -name 'mobile-release.apk' \
            -o -name 'whispr-*.apk' -o -name 'whispr-*.apk.sha256' \) -delete
          if [[ -d "$RUNNER_TEMP/eas-cli" ]]; then
            rm -rf -- "$RUNNER_TEMP/eas-cli"
          fi
          if [[ -d "$RUNNER_TEMP/eas-local-build" ]]; then
            rm -rf -- "$RUNNER_TEMP/eas-local-build"
          fi
          rm -f -- "$RUNNER_TEMP/eas-local-build.log"
          rm -rf -- \
            "$RUNNER_TEMP/android-sdk-download" \
            "$RUNNER_TEMP/aws-cli" \
            "$RUNNER_TEMP/aws-cli-download"

  finalize-release:
    name: Publish verified Android release and download catalog
    needs: [contract, apk]
    if: inputs.kind == 'apk' && !inputs.preflight_only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mobile-${{ inputs.environment }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobile-publication
          path: ${{ runner.temp }}/publication
      - name: Verify public bytes and finalize publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/releases/publish-release.mjs "$RUNNER_TEMP/publication/mobile-publication.json"
