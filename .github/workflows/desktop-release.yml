name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      ring:
        default: uat
        description: Desktop release ring to validate
        options:
          - uat
          - canary
          - stable
        required: true
        type: choice
      version:
        description: Desktop native version, without a leading v
        required: true
        type: string
      web_url:
        default: https://wizardsweb-uat.up.railway.app/
        description: HTTPS Whispr web origin embedded into the desktop build
        required: true
        type: string
      enable_updater:
        default: true
        description: Build with signed updater support and local manifest evidence, even when R2 publishing is disabled
        required: true
        type: boolean
      publish_github_release:
        default: false
        description: Publish a GitHub Release after R2 updater evidence is produced
        required: true
        type: boolean
      publish_r2:
        default: false
        description: Publish updater artifacts to Cloudflare R2 after build evidence is produced
        required: true
        type: boolean
      updater_base_url:
        default: ""
        description: Optional HTTPS updater feed directory. Artifacts are published below releases/<tag>/ and latest.json stays at the feed root. Defaults to https://updates.whispr.team/desktop/<ring>/
        required: false
        type: string
      confirm_stable_release:
        default: false
        description: Required extra guard for stable ring dispatches from main
        required: true
        type: boolean

concurrency:
  group: desktop-release-${{ inputs.ring }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release-contract:
    name: Validate desktop release contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-${{ inputs.ring }}
    outputs:
      enable_updater: ${{ steps.contract.outputs.enable_updater }}
      is_prerelease: ${{ steps.contract.outputs.is_prerelease }}
      publish_github_release: ${{ steps.contract.outputs.publish_github_release }}
      publish_r2: ${{ steps.contract.outputs.publish_r2 }}
      release_ring: ${{ steps.contract.outputs.release_ring }}
      release_tag: ${{ steps.contract.outputs.release_tag }}
      updater_base_url: ${{ steps.contract.outputs.updater_base_url }}
      updater_manifest_url: ${{ steps.contract.outputs.updater_manifest_url }}
      version: ${{ steps.contract.outputs.version }}
      web_url: ${{ steps.contract.outputs.web_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate desktop release dispatch contract
        id: contract
        shell: bash
        run: |
          args=(
            --ring "${{ inputs.ring }}"
            --version "${{ inputs.version }}"
            --web-url "${{ inputs.web_url }}"
            --enable-updater "${{ inputs.enable_updater }}"
            --publish-github-release "${{ inputs.publish_github_release }}"
            --publish-r2 "${{ inputs.publish_r2 }}"
            --confirm-stable-release "${{ inputs.confirm_stable_release }}"
            --ref-name "${{ github.ref_name }}"
            --release-sequence "${{ github.run_number }}"
            --out "$RUNNER_TEMP/desktop-release-contract.json"
          )

          if [[ -n "${{ inputs.updater_base_url }}" ]]; then
            args+=(--updater-base-url "${{ inputs.updater_base_url }}")
          fi

          pnpm --filter @wizards/desktop release:workflow -- "${args[@]}"

      - name: Validate desktop release operations contract
        run: pnpm --filter @wizards/desktop release:ops

      - name: Run desktop release script tests
        run: pnpm --filter @wizards/desktop test

      - name: Upload release contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: desktop-release-contract-${{ steps.contract.outputs.release_ring }}-${{ steps.contract.outputs.version }}
          path: ${{ runner.temp }}/desktop-release-contract.json
          retention-days: 14

      - name: Write release contract summary
        shell: bash
        run: |
          {
            echo "### Desktop release contract"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Ring | \`${{ steps.contract.outputs.release_ring }}\` |"
            echo "| Version | \`${{ steps.contract.outputs.version }}\` |"
            echo "| Planned tag | \`${{ steps.contract.outputs.release_tag }}\` |"
            echo "| Web URL | \`${{ steps.contract.outputs.web_url }}\` |"
            echo "| Updater enabled | \`${{ steps.contract.outputs.enable_updater }}\` |"
            echo "| GitHub Release publish requested | \`${{ steps.contract.outputs.publish_github_release }}\` |"
            echo "| R2 publish requested | \`${{ steps.contract.outputs.publish_r2 }}\` |"
            echo "| Updater artifact base URL | \`${{ steps.contract.outputs.updater_base_url || 'not requested' }}\` |"
            echo "| Updater manifest URL | \`${{ steps.contract.outputs.updater_manifest_url || 'not requested' }}\` |"
            echo "| Pre-release | \`${{ steps.contract.outputs.is_prerelease }}\` |"
            echo ""
            echo "This job validates the release contract. The Windows job builds signed desktop artifacts from the same contract."
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build signed Windows desktop artifacts
    runs-on: windows-latest
    needs: release-contract
    timeout-minutes: 60
    environment: desktop-${{ needs.release-contract.outputs.release_ring }}

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_WEB_URL: ${{ needs.release-contract.outputs.web_url }}
      CARGO_AUDIT_VERSION: 0.22.1
      SCCACHE_SHA256: b8514ed7552e148b0a032114f745118dcb801791adafafeaf9935e4bfb0edf1b
      SCCACHE_VERSION: 0.16.0
      TURBO_TELEMETRY_DISABLED: "1"
      WHISPR_DESKTOP_SENTRY_DSN: ${{ vars.WHISPR_DESKTOP_SENTRY_DSN }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WHISPR_DESKTOP_RELEASE_RING: ${{ needs.release-contract.outputs.release_ring }}
      WHISPR_DESKTOP_UPDATER_ENABLED: ${{ needs.release-contract.outputs.enable_updater }}
      WHISPR_DESKTOP_UPDATER_ENDPOINTS: ${{ needs.release-contract.outputs.updater_manifest_url }}
      WHISPR_DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.WHISPR_DESKTOP_UPDATER_PUBLIC_KEY }}
      WHISPR_DESKTOP_WINDOWS_SIGNING_CERT_KIND: ${{ vars.WHISPR_DESKTOP_WINDOWS_SIGNING_CERT_KIND }}
      WHISPR_DESKTOP_WINDOWS_SIGNING_ENABLED: ${{ (needs.release-contract.outputs.release_ring == 'stable' || needs.release-contract.outputs.enable_updater == 'true') && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true

      - name: Resolve sccache directories
        id: sccache_paths
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TOOL_CACHE "sccache\$env:SCCACHE_VERSION"
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE ".sccache"

          "tool_dir=$toolDir" >> $env:GITHUB_OUTPUT
          "cache_dir=$cacheDir" >> $env:GITHUB_OUTPUT

      - name: Cache sccache compiler outputs
        id: sccache_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sccache_paths.outputs.cache_dir }}
          key: sccache-${{ runner.os }}-${{ env.SCCACHE_VERSION }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ env.SCCACHE_VERSION }}-

      - name: Install and configure sccache
        shell: pwsh
        run: |
          $toolDir = "${{ steps.sccache_paths.outputs.tool_dir }}"
          $cacheDir = "${{ steps.sccache_paths.outputs.cache_dir }}"
          $sccacheExe = Join-Path $toolDir "sccache.exe"
          $ProgressPreference = "SilentlyContinue"

          if (-not (Test-Path $sccacheExe)) {
            $archive = Join-Path $env:RUNNER_TEMP "sccache-$env:SCCACHE_VERSION.zip"
            $extractDir = Join-Path $env:RUNNER_TEMP "sccache-$env:SCCACHE_VERSION"
            $downloadUrl = "https://github.com/mozilla/sccache/releases/download/v$env:SCCACHE_VERSION/sccache-v$env:SCCACHE_VERSION-x86_64-pc-windows-msvc.zip"

            Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
            $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $env:SCCACHE_SHA256) {
              Write-Error "sccache archive checksum mismatch. Expected $env:SCCACHE_SHA256, got $actualHash."
              exit 1
            }

            Expand-Archive -Path $archive -DestinationPath $extractDir -Force
            $expandedSccache = Get-ChildItem -Path $extractDir -Filter "sccache.exe" -Recurse -File | Select-Object -First 1
            if (-not $expandedSccache) {
              Write-Error "sccache.exe was not found inside the downloaded archive."
              exit 1
            }

            New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
            Copy-Item -LiteralPath $expandedSccache.FullName -Destination $sccacheExe -Force
          }

          $sccacheVersion = (& $sccacheExe --version).Trim()
          if ($sccacheVersion -notmatch [regex]::Escape($env:SCCACHE_VERSION)) {
            Write-Error "Unexpected sccache version: expected $env:SCCACHE_VERSION, got $sccacheVersion."
            exit 1
          }

          "${{ steps.sccache_paths.outputs.tool_dir }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "RUSTC_WRAPPER=$sccacheExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCCACHE_CACHE_SIZE=2G" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCCACHE_DIR=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "sccache version: $sccacheVersion"
          "sccache cache hit: ${{ steps.sccache_cache.outputs.cache-hit }}"

      - name: Resolve cargo-audit cache directory
        id: cargo_audit_paths
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TOOL_CACHE "cargo-audit\$env:CARGO_AUDIT_VERSION"
          $binDir = Join-Path $toolDir "bin"

          "tool_dir=$toolDir" >> $env:GITHUB_OUTPUT
          "bin_dir=$binDir" >> $env:GITHUB_OUTPUT
          "cache_key=cargo-audit-$env:RUNNER_OS-$env:CARGO_AUDIT_VERSION" >> $env:GITHUB_OUTPUT

      - name: Cache cargo-audit binary
        id: cargo_audit_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cargo_audit_paths.outputs.tool_dir }}
          key: ${{ steps.cargo_audit_paths.outputs.cache_key }}

      - name: Add cargo-audit to PATH
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ steps.cargo_audit_paths.outputs.bin_dir }}" | Out-Null
          "${{ steps.cargo_audit_paths.outputs.bin_dir }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Require stable Windows code signing configuration
        if: needs.release-contract.outputs.release_ring == 'stable'
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) { $missing += "WINDOWS_CERTIFICATE_PFX_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { $missing += "WINDOWS_CERTIFICATE_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:WHISPR_DESKTOP_WINDOWS_SIGNING_CERT_KIND)) { $missing += "WHISPR_DESKTOP_WINDOWS_SIGNING_CERT_KIND" }

          $certificateKind = $env:WHISPR_DESKTOP_WINDOWS_SIGNING_CERT_KIND.Trim().ToUpperInvariant()
          if ($certificateKind -and $certificateKind -notin @("OV", "EV")) {
            $missing += "WHISPR_DESKTOP_WINDOWS_SIGNING_CERT_KIND=OV|EV"
          }

          if ($missing.Count -gt 0) {
            Write-Error "Stable desktop releases require a real OV/EV Windows signing configuration before artifacts can be produced: $($missing -join ', ')."
            exit 1
          }

      - name: Require updater signing configuration when updater artifacts are requested
        if: needs.release-contract.outputs.enable_updater == 'true'
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WHISPR_DESKTOP_UPDATER_ENDPOINTS)) { $missing += "WHISPR_DESKTOP_UPDATER_ENDPOINTS" }
          if ([string]::IsNullOrWhiteSpace($env:WHISPR_DESKTOP_UPDATER_PUBLIC_KEY)) { $missing += "WHISPR_DESKTOP_UPDATER_PUBLIC_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { $missing += "TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { $missing += "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if ($env:WHISPR_DESKTOP_WINDOWS_SIGNING_ENABLED -ne "true") { $missing += "WHISPR_DESKTOP_WINDOWS_SIGNING_ENABLED" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) { $missing += "WINDOWS_CERTIFICATE_PFX_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { $missing += "WINDOWS_CERTIFICATE_PASSWORD" }

          if ($missing.Count -gt 0) {
            Write-Error "Updater artifacts require Ed25519 signing, an HTTPS updater endpoint, and Windows signing config. A self-signed PFX is acceptable for UAT, but missing config is not: $($missing -join ', ')."
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Generate desktop production config
        run: pnpm --filter @wizards/desktop build:desktop:config

      - name: Validate generated desktop config and release operations
        run: pnpm --filter @wizards/desktop release:ops

      - name: Run desktop release script tests
        run: pnpm --filter @wizards/desktop test

      - name: Install cargo-audit
        if: steps.cargo_audit_cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-audit --version $env:CARGO_AUDIT_VERSION --locked --root "${{ steps.cargo_audit_paths.outputs.tool_dir }}" --force

      - name: Verify cargo-audit
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          $expectedBinDir = [IO.Path]::GetFullPath("${{ steps.cargo_audit_paths.outputs.bin_dir }}")
          $cargoAudit = Get-Command cargo-audit -ErrorAction SilentlyContinue
          if (-not $cargoAudit) {
            Write-Error "cargo-audit was not found after cache restore/install."
            exit 1
          }

          $cargoAuditPath = [IO.Path]::GetFullPath($cargoAudit.Source)
          if (-not $cargoAuditPath.StartsWith($expectedBinDir, [StringComparison]::OrdinalIgnoreCase)) {
            Write-Error "cargo-audit resolved from an unexpected path. Expected under '$expectedBinDir', got '$cargoAuditPath'."
            exit 1
          }

          $currentVersion = (& $cargoAuditPath --version).Trim()
          $expectedVersionPattern = "(^|\s)$([regex]::Escape($env:CARGO_AUDIT_VERSION))(\s|$)"
          if ($currentVersion -notmatch $expectedVersionPattern) {
            Write-Error "Unexpected cargo-audit version: expected version token '$env:CARGO_AUDIT_VERSION', got '$currentVersion'."
            exit 1
          }

          "cargo-audit cache hit: ${{ steps.cargo_audit_cache.outputs.cache-hit }}"
          "cargo-audit version: $currentVersion"
          "cargo-audit path: $cargoAuditPath"

      - name: Run cargo audit and summarize
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          $cargoAuditJson = Join-Path $env:RUNNER_TEMP "desktop-cargo-audit.json"
          $cargoAuditSummary = Join-Path $env:RUNNER_TEMP "desktop-cargo-audit-summary.json"

          cargo audit --json | Out-File -FilePath $cargoAuditJson -Encoding utf8
          $auditExitCode = $LASTEXITCODE

          $srcTauriPath = Get-Location
          Set-Location $env:GITHUB_WORKSPACE
          pnpm --filter @wizards/desktop release:cargo-audit-summary -- `
            --input "$cargoAuditJson" `
            --out "$cargoAuditSummary"
          Set-Location $srcTauriPath

          if ($auditExitCode -ne 0) {
            Write-Error "cargo audit reported vulnerability findings. See desktop-cargo-audit-summary.json in release artifacts."
            exit $auditExitCode
          }

      - name: Build desktop app
        run: pnpm --filter @wizards/desktop build:desktop

      - name: Sign stable desktop artifacts without updater bundle signing
        if: needs.release-contract.outputs.release_ring == 'stable' && needs.release-contract.outputs.enable_updater != 'true'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "whispr-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))

            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $signtool) {
              throw "signtool.exe was not found on the Windows runner."
            }

            $artifacts = @(
              Get-ChildItem "apps\desktop\src-tauri\target\release" -Filter "*.exe" -File -ErrorAction SilentlyContinue
              Get-ChildItem "apps\desktop\src-tauri\target\release\bundle" -Include "*.exe", "*.msi" -Recurse -File -ErrorAction SilentlyContinue
            )

            if ($artifacts.Count -eq 0) {
              throw "No desktop artifacts were found to sign."
            }

            foreach ($artifact in $artifacts) {
              & $signtool.FullName sign /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $artifact.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed for $($artifact.FullName) with exit code $LASTEXITCODE."
              }
            }
          } finally {
            if (Test-Path $certificatePath) {
              Remove-Item $certificatePath -Force
            }
          }

      - name: Create desktop build metadata
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\src-tauri\target\release\bundle\nsis"

          pnpm --filter @wizards/desktop release:artifacts -- `
            --version "${{ needs.release-contract.outputs.version }}" `
            --ring "${{ needs.release-contract.outputs.release_ring }}" `
            --updater-enabled "${{ needs.release-contract.outputs.enable_updater }}" `
            --artifact-dir "$artifactDir" `
            --out "$env:RUNNER_TEMP\desktop-build-metadata.json"

      - name: Generate and validate updater manifest evidence
        if: needs.release-contract.outputs.enable_updater == 'true'
        shell: pwsh
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP "desktop-build-metadata.json"
          $metadata = Get-Content $metadataPath -Raw | ConvertFrom-Json
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\src-tauri\target\release\bundle\nsis"
          $dependencyAuditPath = Join-Path $env:RUNNER_TEMP "desktop-cargo-audit-summary.json"
          $evidenceDir = Join-Path $env:RUNNER_TEMP "desktop-release-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null

          $installerPath = Join-Path $artifactDir $metadata.artifacts.installer.filename
          if (-not $metadata.artifacts.signature -or [string]::IsNullOrWhiteSpace($metadata.artifacts.signature.filename)) {
            Write-Error "Updater release evidence requires a generated .sig file."
            exit 1
          }

          $signaturePath = Join-Path $artifactDir $metadata.artifacts.signature.filename
          $manifestPath = Join-Path $artifactDir "latest.json"
          $notes = "Whispr Desktop ${{ needs.release-contract.outputs.release_ring }} release ${{ needs.release-contract.outputs.version }}."

          pnpm --filter @wizards/desktop release:manifest -- `
            --artifact "$installerPath" `
            --signature "$signaturePath" `
            --base-url "${{ needs.release-contract.outputs.updater_base_url }}" `
            --version "${{ needs.release-contract.outputs.version }}" `
            --notes "$notes" `
            --out "$manifestPath"

          pnpm --filter @wizards/desktop release:validate-manifest -- `
            --manifest "$manifestPath" `
            --artifact "$installerPath" `
            --signature "$signaturePath" `
            --ring "${{ needs.release-contract.outputs.release_ring }}" `
            --release-tag "${{ needs.release-contract.outputs.release_tag }}" `
            --expected-version "${{ needs.release-contract.outputs.version }}"

          $auditPath = Join-Path $evidenceDir "desktop-release-audit-${{ needs.release-contract.outputs.version }}-${{ needs.release-contract.outputs.release_ring }}.json"

          pnpm --filter @wizards/desktop release:audit -- `
            --ring "${{ needs.release-contract.outputs.release_ring }}" `
            --web-url "${{ needs.release-contract.outputs.web_url }}" `
            --manifest "$manifestPath" `
            --manifest-url "${{ needs.release-contract.outputs.updater_manifest_url }}" `
            --artifact "$installerPath" `
            --dependency-audit "$dependencyAuditPath" `
            --signature "$signaturePath" `
            --release-tag "${{ needs.release-contract.outputs.release_tag }}" `
            --expected-version "${{ needs.release-contract.outputs.version }}" `
            --require-manifest `
            --out "$auditPath"

          pnpm --filter @wizards/desktop release:promotion -- `
            --ring "${{ needs.release-contract.outputs.release_ring }}" `
            --web-url "${{ needs.release-contract.outputs.web_url }}" `
            --manifest "$manifestPath" `
            --manifest-url "${{ needs.release-contract.outputs.updater_manifest_url }}" `
            --artifact "$installerPath" `
            --dependency-audit "$dependencyAuditPath" `
            --signature "$signaturePath" `
            --release-tag "${{ needs.release-contract.outputs.release_tag }}" `
            --expected-version "${{ needs.release-contract.outputs.version }}" `
            --out-dir "$evidenceDir"

      - name: Capture sccache stats
        if: always()
        shell: pwsh
        run: |
          $statsPath = Join-Path $env:RUNNER_TEMP "desktop-sccache-stats.txt"

          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats | Tee-Object -FilePath $statsPath
            sccache --stop-server
            if ($LASTEXITCODE -ne 0) {
              $message = "sccache stop-server returned exit code $LASTEXITCODE. This is non-fatal when no compiler server was started."
              Write-Warning $message
              Add-Content -Path $statsPath -Value ""
              Add-Content -Path $statsPath -Value $message
              $global:LASTEXITCODE = 0
            }
          } else {
            "sccache was not available on PATH." | Tee-Object -FilePath $statsPath
          }

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: desktop-build-${{ needs.release-contract.outputs.release_ring }}-${{ needs.release-contract.outputs.version }}-windows
          path: |
            ${{ runner.temp }}/desktop-build-metadata.json
            ${{ runner.temp }}/desktop-cargo-audit-summary.json
            ${{ runner.temp }}/desktop-sccache-stats.txt
            ${{ runner.temp }}/desktop-release-evidence/**
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.json
          retention-days: 14

      - name: Write desktop build summary
        shell: pwsh
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP "desktop-build-metadata.json"
          $metadata = Get-Content $metadataPath -Raw | ConvertFrom-Json
          $dependencyAuditPath = Join-Path $env:RUNNER_TEMP "desktop-cargo-audit-summary.json"
          $dependencyAudit = if (Test-Path $dependencyAuditPath) {
            Get-Content $dependencyAuditPath -Raw | ConvertFrom-Json
          } else {
            $null
          }
          $dependencyVulnerabilities = if ($dependencyAudit) { $dependencyAudit.vulnerabilities.count } else { "not recorded" }
          $dependencyWarnings = if ($dependencyAudit) { $dependencyAudit.warnings.count } else { "not recorded" }
          $signatureFile = if ($metadata.artifacts.signature) { $metadata.artifacts.signature.filename } else { "not generated" }
          $manifestUrl = "${{ needs.release-contract.outputs.updater_manifest_url }}"
          if ([string]::IsNullOrWhiteSpace($manifestUrl)) {
            $manifestUrl = "not requested"
          }

          @"
          ### Desktop Windows build

          | Field | Value |
          | --- | --- |
          | Ring | ``$($metadata.releaseRing)`` |
          | Version | ``$($metadata.version)`` |
          | Platform | ``$($metadata.platform)`` |
          | Updater artifacts | ``$($metadata.updaterEnabled)`` |
          | Installer | ``$($metadata.artifacts.installer.filename)`` |
          | Installer SHA-256 | ``$($metadata.artifacts.installer.sha256)`` |
          | Signature | ``$signatureFile`` |
          | Manifest URL | ``$manifestUrl`` |
          | Dependency vulnerabilities | ``$dependencyVulnerabilities`` |
          | Dependency warnings | ``$dependencyWarnings`` |
          "@ >> $env:GITHUB_STEP_SUMMARY

  publish-release:
    name: Publish desktop release artifacts
    runs-on: ubuntu-latest
    needs:
      - release-contract
      - build-windows
    if: needs.release-contract.outputs.publish_r2 == 'true' || needs.release-contract.outputs.publish_github_release == 'true'
    timeout-minutes: 25
    environment: desktop-${{ needs.release-contract.outputs.release_ring }}
    permissions:
      contents: write

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download desktop build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-build-${{ needs.release-contract.outputs.release_ring }}-${{ needs.release-contract.outputs.version }}-windows
          path: ${{ runner.temp }}/desktop-build

      - name: Locate publish assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          root="$RUNNER_TEMP/desktop-build"
          version="${{ needs.release-contract.outputs.version }}"
          ring="${{ needs.release-contract.outputs.release_ring }}"

          find_one() {
            local pattern="$1"
            local label="$2"
            local result
            result="$(find "$root" -type f -name "$pattern" | sort | head -n 1)"
            if [[ -z "$result" ]]; then
              echo "::error::Missing desktop publish asset: $label ($pattern)"
              exit 1
            fi
            printf '%s' "$result"
          }

          installer="$(find_one "Whispr_${version}_*setup.exe" "installer")"
          installer_name="$(basename "$installer")"
          signature="$(find_one "${installer_name}.sig" "signature")"
          manifest="$(find_one "latest.json" "manifest")"
          metadata="$(find_one "desktop-build-metadata.json" "build metadata")"
          audit="$(find_one "desktop-release-audit-${version}-${ring}.json" "release audit")"
          dependency_audit="$(find_one "desktop-cargo-audit-summary.json" "dependency audit")"
          promotion_json="$(find_one "desktop-release-promotion-${version}-${ring}.json" "promotion JSON")"
          promotion_md="$(find_one "desktop-release-promotion-${version}-${ring}.md" "promotion Markdown")"

          {
            echo "installer=$installer"
            echo "signature=$signature"
            echo "manifest=$manifest"
            echo "metadata=$metadata"
            echo "audit=$audit"
            echo "dependency_audit=$dependency_audit"
            echo "promotion_json=$promotion_json"
            echo "promotion_md=$promotion_md"
          } >> "$GITHUB_OUTPUT"

      - name: Create desktop publish plan
        id: publish_plan
        shell: bash
        run: |
          set -euo pipefail

          output_path="$RUNNER_TEMP/desktop-publish-plan.json"

          pnpm --filter @wizards/desktop release:publish-plan -- \
            --ring "${{ needs.release-contract.outputs.release_ring }}" \
            --version "${{ needs.release-contract.outputs.version }}" \
            --release-tag "${{ needs.release-contract.outputs.release_tag }}" \
            --web-url "${{ needs.release-contract.outputs.web_url }}" \
            --updater-base-url "${{ needs.release-contract.outputs.updater_base_url }}" \
            --publish-r2 "${{ needs.release-contract.outputs.publish_r2 }}" \
            --publish-github-release "${{ needs.release-contract.outputs.publish_github_release }}" \
            --artifact "${{ steps.assets.outputs.installer }}" \
            --manifest "${{ steps.assets.outputs.manifest }}" \
            --signature "${{ steps.assets.outputs.signature }}" \
            --metadata "${{ steps.assets.outputs.metadata }}" \
            --audit "${{ steps.assets.outputs.audit }}" \
            --promotion-json "${{ steps.assets.outputs.promotion_json }}" \
            --promotion-md "${{ steps.assets.outputs.promotion_md }}" \
            --out "$output_path"

          echo "path=$output_path" >> "$GITHUB_OUTPUT"

      - name: Require R2 publishing secrets
        if: needs.release-contract.outputs.publish_r2 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${R2_ACCESS_KEY_ID:-}" ]] || missing+=("R2_ACCESS_KEY_ID")
          [[ -n "${R2_SECRET_ACCESS_KEY:-}" ]] || missing+=("R2_SECRET_ACCESS_KEY")
          [[ -n "${R2_BUCKET:-}" ]] || missing+=("R2_BUCKET")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::R2 publishing is enabled but required secrets are missing: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Verify preinstalled AWS CLI v2 for R2 upload
        if: needs.release-contract.outputs.publish_r2 == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v aws >/dev/null 2>&1; then
            echo "::error::The protected R2 publishing runner must provide AWS CLI v2."
            exit 1
          fi

          version="$(aws --version 2>&1)"
          if [[ "$version" != aws-cli/2.* ]]; then
            echo "::error::Expected preinstalled AWS CLI v2, got: $version"
            exit 1
          fi

          printf '%s\n' "AWS CLI: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish updater artifacts to Cloudflare R2
        if: needs.release-contract.outputs.publish_r2 == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          endpoint_url="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ring="${{ needs.release-contract.outputs.release_ring }}"
          release_tag="${{ needs.release-contract.outputs.release_tag }}"
          installer="${{ steps.assets.outputs.installer }}"
          signature="${{ steps.assets.outputs.signature }}"
          manifest="${{ steps.assets.outputs.manifest }}"
          installer_name="$(basename "$installer")"
          signature_name="$(basename "$signature")"
          release_prefix="desktop/${ring}/releases/${release_tag}"

          aws --endpoint-url "$endpoint_url" s3 cp "$installer" "s3://${R2_BUCKET}/${release_prefix}/${installer_name}" \
            --content-type "application/vnd.microsoft.portable-executable" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

          aws --endpoint-url "$endpoint_url" s3 cp "$signature" "s3://${R2_BUCKET}/${release_prefix}/${signature_name}" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

          aws --endpoint-url "$endpoint_url" s3 cp "$manifest" "s3://${R2_BUCKET}/desktop/${ring}/latest.json" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --no-progress

      - name: Validate remote updater feed
        if: needs.release-contract.outputs.publish_r2 == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if pnpm --filter @wizards/desktop release:validate-manifest -- \
              --manifest "${{ needs.release-contract.outputs.updater_manifest_url }}" \
              --artifact "${{ steps.assets.outputs.installer }}" \
              --signature "${{ steps.assets.outputs.signature }}" \
              --ring "${{ needs.release-contract.outputs.release_ring }}" \
              --release-tag "${{ needs.release-contract.outputs.release_tag }}" \
              --expected-version "${{ needs.release-contract.outputs.version }}" \
              --check-artifact-url; then
              exit 0
            fi

            if [[ "$attempt" == "5" ]]; then
              echo "::error::Remote updater feed validation failed after $attempt attempts."
              exit 1
            fi

            sleep $((attempt * 5))
          done

      - name: Publish GitHub Release
        if: needs.release-contract.outputs.publish_github_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${{ needs.release-contract.outputs.release_tag }}"
          title="Whispr Desktop ${{ needs.release-contract.outputs.version }}"
          if [[ "${{ needs.release-contract.outputs.release_ring }}" != "stable" ]]; then
            title="$title ${{ needs.release-contract.outputs.release_ring }}"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::GitHub Release already exists for $tag. Delete it manually or use a new release tag."
            exit 1
          fi

          args=(
            "$tag"
            "${{ steps.assets.outputs.installer }}"
            "${{ steps.assets.outputs.manifest }}"
            "${{ steps.assets.outputs.signature }}"
            "${{ steps.assets.outputs.metadata }}"
            "${{ steps.assets.outputs.audit }}"
            "${{ steps.assets.outputs.dependency_audit }}"
            "${{ steps.assets.outputs.promotion_json }}"
            "${{ steps.assets.outputs.promotion_md }}"
            "${{ steps.publish_plan.outputs.path }}"
            --target "$GITHUB_SHA"
            --title "$title"
            --notes-file "${{ steps.assets.outputs.promotion_md }}"
          )

          if [[ "${{ needs.release-contract.outputs.is_prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

      - name: Upload desktop publish evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: desktop-publish-evidence-${{ needs.release-contract.outputs.release_ring }}-${{ needs.release-contract.outputs.version }}
          path: ${{ steps.publish_plan.outputs.path }}
          retention-days: 30

      - name: Write publish summary
        shell: bash
        run: |
          set -euo pipefail

          artifact_name="$(basename "${{ steps.assets.outputs.installer }}")"
          artifact_url="${{ needs.release-contract.outputs.updater_base_url }}${artifact_name}"
          artifact_sha="$(node -e "const fs = require('fs'); const metadata = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(metadata.artifacts.installer.sha256);" "${{ steps.assets.outputs.metadata }}")"
          artifact_size="$(node -e "const fs = require('fs'); const metadata = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(metadata.artifacts.installer.sizeBytes);" "${{ steps.assets.outputs.metadata }}")"

          {
            echo "### Desktop release publishing"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Ring | \`${{ needs.release-contract.outputs.release_ring }}\` |"
            echo "| Version | \`${{ needs.release-contract.outputs.version }}\` |"
            echo "| Tag | \`${{ needs.release-contract.outputs.release_tag }}\` |"
            echo "| R2 | \`${{ needs.release-contract.outputs.publish_r2 }}\` |"
            echo "| GitHub Release | \`${{ needs.release-contract.outputs.publish_github_release }}\` |"
            echo "| Manifest | \`${{ needs.release-contract.outputs.updater_manifest_url }}\` |"
            echo "| Artifact URL | \`$artifact_url\` |"
            echo "| Artifact SHA-256 | \`$artifact_sha\` |"
            echo "| Artifact size | \`$artifact_size bytes\` |"
            echo ""
            echo "#### Manual QA next steps"
            echo ""
            echo "- Install the previous desktop version for \`${{ needs.release-contract.outputs.release_ring }}\`."
            echo "- Confirm the updater card sees \`${{ needs.release-contract.outputs.version }}\` from \`${{ needs.release-contract.outputs.updater_manifest_url }}\`."
            echo "- Click Download and restart, then confirm Settings -> About reports the new desktop runtime version."
            echo "- Run launch, auth restore, close-to-tray, voice, overlay, notification, and shortcut smoke checks."
            echo ""
            echo "#### Performance evidence"
            echo ""
            echo "- [ ] \`warm-start\` <= 2000ms"
            echo "- [ ] \`idle-memory\` <= 220MB"
            echo "- [ ] \`updater-check-install\` succeeds"
            echo "- [ ] \`overlay-cpu\` <= 3% average"
            echo "- [ ] \`shortcut-latency\` <= 50ms p95"
            echo ""
            echo "#### Rollback"
            echo ""
            echo "Rollback remains manifest-based. Restore the previous signed manifest with:"
            echo ""
            echo "\`\`\`bash"
            echo "aws --endpoint-url <r2-endpoint> s3 cp <previous-latest.json> s3://<R2_BUCKET>/desktop/${{ needs.release-contract.outputs.release_ring }}/latest.json --content-type application/json --cache-control \"no-cache, no-store, must-revalidate\""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  timing-summary:
    name: Summarize desktop release timing
    runs-on: ubuntu-latest
    needs:
      - release-contract
      - build-windows
      - publish-release
    if: always()
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Generate desktop release timing summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node apps/desktop/scripts/desktop-release-timing-summary.mjs \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --ring "${{ needs.release-contract.outputs.release_ring || inputs.ring }}" \
            --out "$RUNNER_TEMP/desktop-release-timing.json"

      - name: Upload desktop release timing evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: desktop-release-timing-${{ needs.release-contract.outputs.release_ring || inputs.ring }}-${{ needs.release-contract.outputs.version || inputs.version }}
          path: ${{ runner.temp }}/desktop-release-timing.json
          retention-days: 30
