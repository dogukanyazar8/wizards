name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      ring:
        default: uat
        description: Release channel (UAT or Stable)
        options:
          - uat
          - stable
        required: true
        type: choice
      version:
        description: "App version without v (example: 0.9.1)"
        required: true
        type: string
      web_url:
        default: https://wizardsweb-uat.up.railway.app/
        description: Web address opened by the desktop app
        required: true
        type: string
      enable_updater:
        default: true
        description: Enable secure automatic updates
        required: true
        type: boolean
      windows_signing:
        default: false
        description: Sign the Windows installer (optional; requires a certificate)
        required: true
        type: boolean
      publish_github_release:
        default: false
        description: Publish the build as a GitHub Release
        required: true
        type: boolean
      publish_r2:
        default: false
        description: Publish automatic-update files to Cloudflare R2
        required: true
        type: boolean
      updater_base_url:
        default: ""
        description: Optional update address; leave blank for the default
        required: false
        type: string
      confirm_stable_release:
        default: false
        description: Confirm a Stable release from main
        required: true
        type: boolean

concurrency:
  group: desktop-release-${{ inputs.ring }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-contract:
    name: Validate desktop release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: (inputs.ring == 'uat' && github.ref == 'refs/heads/uat') || (inputs.ring == 'stable' && github.ref == 'refs/heads/main')
    outputs:
      enable_updater: ${{ steps.contract.outputs.enable_updater }}
      is_prerelease: ${{ steps.contract.outputs.is_prerelease }}
      publish_github_release: ${{ steps.contract.outputs.publish_github_release }}
      publish_r2: ${{ steps.contract.outputs.publish_r2 }}
      release_ring: ${{ steps.contract.outputs.release_ring }}
      release_tag: ${{ steps.contract.outputs.release_tag }}
      updater_base_url: ${{ steps.contract.outputs.updater_base_url }}
      updater_manifest_url: ${{ steps.contract.outputs.updater_manifest_url }}
      version: ${{ steps.contract.outputs.version }}
      web_url: ${{ steps.contract.outputs.web_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate desktop release dispatch contract
        id: contract
        shell: bash
        env:
          VALUE_INPUTS_RING: ${{ inputs.ring }}
          VALUE_INPUTS_VERSION: ${{ inputs.version }}
          VALUE_INPUTS_WEB_URL: ${{ inputs.web_url }}
          VALUE_INPUTS_ENABLE_UPDATER: ${{ inputs.enable_updater }}
          VALUE_INPUTS_PUBLISH_GITHUB_RELEASE: ${{ inputs.publish_github_release }}
          VALUE_INPUTS_PUBLISH_R2: ${{ inputs.publish_r2 }}
          VALUE_INPUTS_CONFIRM_STABLE_RELEASE: ${{ inputs.confirm_stable_release }}
          VALUE_GITHUB_REF_NAME: ${{ github.ref_name }}
          VALUE_GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VALUE_INPUTS_UPDATER_BASE_URL: ${{ inputs.updater_base_url }}
        run: |
          args=(
            --ring "${VALUE_INPUTS_RING}"
            --version "${VALUE_INPUTS_VERSION}"
            --web-url "${VALUE_INPUTS_WEB_URL}"
            --enable-updater "${VALUE_INPUTS_ENABLE_UPDATER}"
            --publish-github-release "${VALUE_INPUTS_PUBLISH_GITHUB_RELEASE}"
            --publish-r2 "${VALUE_INPUTS_PUBLISH_R2}"
            --confirm-stable-release "${VALUE_INPUTS_CONFIRM_STABLE_RELEASE}"
            --ref-name "${VALUE_GITHUB_REF_NAME}"
            --release-sequence "${VALUE_GITHUB_RUN_NUMBER}"
            --out "$RUNNER_TEMP/desktop-release-contract.json"
          )

          if [[ -n "${VALUE_INPUTS_UPDATER_BASE_URL}" ]]; then
            args+=(--updater-base-url "${VALUE_INPUTS_UPDATER_BASE_URL}")
          fi

          pnpm --filter @wizards/desktop release:workflow -- "${args[@]}"

      - name: Validate desktop release operations contract
        run: pnpm --filter @wizards/desktop release:ops

      - name: Test unified release publisher
        run: node --test scripts/releases/*.test.mjs

      - name: Run desktop release script tests
        run: pnpm --filter @wizards/desktop test

      - name: Upload release contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: desktop-release-contract-${{ steps.contract.outputs.release_ring }}-${{ steps.contract.outputs.version }}
          path: ${{ runner.temp }}/desktop-release-contract.json
          retention-days: 14

      - name: Write release contract summary
        shell: bash
        env:
          VALUE_STEPS_CONTRACT_OUTPUTS_RELEASE_RING: ${{ steps.contract.outputs.release_ring }}
          VALUE_STEPS_CONTRACT_OUTPUTS_VERSION: ${{ steps.contract.outputs.version }}
          VALUE_STEPS_CONTRACT_OUTPUTS_RELEASE_TAG: ${{ steps.contract.outputs.release_tag }}
          VALUE_STEPS_CONTRACT_OUTPUTS_WEB_URL: ${{ steps.contract.outputs.web_url }}
          VALUE_STEPS_CONTRACT_OUTPUTS_ENABLE_UPDATER: ${{ steps.contract.outputs.enable_updater }}
          VALUE_STEPS_CONTRACT_OUTPUTS_PUBLISH_GITHUB_RELEASE: ${{ steps.contract.outputs.publish_github_release }}
          VALUE_STEPS_CONTRACT_OUTPUTS_PUBLISH_R2: ${{ steps.contract.outputs.publish_r2 }}
          VALUE_STEPS_CONTRACT_OUTPUTS_UPDATER_BASE_URL_NOT_REQUESTED: ${{ steps.contract.outputs.updater_base_url || 'not requested' }}
          VALUE_STEPS_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL_NOT_REQUESTED: ${{ steps.contract.outputs.updater_manifest_url || 'not requested' }}
          VALUE_STEPS_CONTRACT_OUTPUTS_IS_PRERELEASE: ${{ steps.contract.outputs.is_prerelease }}
        run: |
          {
            echo "### Desktop release contract"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Ring | \`${VALUE_STEPS_CONTRACT_OUTPUTS_RELEASE_RING}\` |"
            echo "| Version | \`${VALUE_STEPS_CONTRACT_OUTPUTS_VERSION}\` |"
            echo "| Planned tag | \`${VALUE_STEPS_CONTRACT_OUTPUTS_RELEASE_TAG}\` |"
            echo "| Web URL | \`${VALUE_STEPS_CONTRACT_OUTPUTS_WEB_URL}\` |"
            echo "| Updater enabled | \`${VALUE_STEPS_CONTRACT_OUTPUTS_ENABLE_UPDATER}\` |"
            echo "| GitHub Release publish requested | \`${VALUE_STEPS_CONTRACT_OUTPUTS_PUBLISH_GITHUB_RELEASE}\` |"
            echo "| R2 publish requested | \`${VALUE_STEPS_CONTRACT_OUTPUTS_PUBLISH_R2}\` |"
            echo "| Updater artifact base URL | \`${VALUE_STEPS_CONTRACT_OUTPUTS_UPDATER_BASE_URL_NOT_REQUESTED}\` |"
            echo "| Updater manifest URL | \`${VALUE_STEPS_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL_NOT_REQUESTED}\` |"
            echo "| Pre-release | \`${VALUE_STEPS_CONTRACT_OUTPUTS_IS_PRERELEASE}\` |"
            echo ""
            echo "This job validates the release contract. Windows Authenticode signing is optional; updater signatures remain required when updater support is enabled."
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build Windows desktop artifacts
    runs-on: windows-2025
    needs: release-contract
    timeout-minutes: 90
    environment: desktop-${{ needs.release-contract.outputs.release_ring }}

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_WEB_URL: ${{ needs.release-contract.outputs.web_url }}
      CARGO_AUDIT_VERSION: 0.22.2
      SCCACHE_SHA256: 8965c74d5e8a225244f741e18ad2f3f504f48228dc1bac948fc22761a348363d
      SCCACHE_VERSION: 0.18.0
      TURBO_TELEMETRY_DISABLED: "1"
      WHISPR_DESKTOP_SENTRY_DSN: ${{ secrets.WHISPR_DESKTOP_SENTRY_DSN || vars.WHISPR_DESKTOP_SENTRY_DSN }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WHISPR_DESKTOP_RELEASE_RING: ${{ needs.release-contract.outputs.release_ring }}
      WHISPR_DESKTOP_UPDATER_ENABLED: ${{ needs.release-contract.outputs.enable_updater }}
      WHISPR_DESKTOP_UPDATER_ENDPOINTS: ${{ needs.release-contract.outputs.release_ring == 'uat' && 'https://wizardsweb-uat.up.railway.app' || 'https://whispr.team' }}/api/v1/releases/desktop/${{ needs.release-contract.outputs.release_ring }}/latest.json
      WHISPR_DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.WHISPR_DESKTOP_UPDATER_PUBLIC_KEY }}
      WHISPR_DESKTOP_WINDOWS_SIGNING_CERT_KIND: ${{ vars.WHISPR_DESKTOP_WINDOWS_SIGNING_CERT_KIND }}
      WHISPR_DESKTOP_WINDOWS_SIGNING_ENABLED: ${{ inputs.windows_signing && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true

      - name: Resolve sccache directories
        id: sccache_paths
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TOOL_CACHE "sccache\$env:SCCACHE_VERSION"
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE ".sccache"

          "tool_dir=$toolDir" >> $env:GITHUB_OUTPUT
          "cache_dir=$cacheDir" >> $env:GITHUB_OUTPUT

      - name: Cache sccache compiler outputs
        id: sccache_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sccache_paths.outputs.cache_dir }}
          key: sccache-${{ runner.os }}-${{ env.SCCACHE_VERSION }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ env.SCCACHE_VERSION }}-

      - name: Install and configure sccache
        shell: pwsh
        env:
          VALUE_STEPS_SCCACHE_PATHS_OUTPUTS_TOOL_DIR: ${{ steps.sccache_paths.outputs.tool_dir }}
          VALUE_STEPS_SCCACHE_PATHS_OUTPUTS_CACHE_DIR: ${{ steps.sccache_paths.outputs.cache_dir }}
          VALUE_STEPS_SCCACHE_CACHE_OUTPUTS_CACHE_HIT: ${{ steps.sccache_cache.outputs.cache-hit }}
        run: |
          $toolDir = "$env:VALUE_STEPS_SCCACHE_PATHS_OUTPUTS_TOOL_DIR"
          $cacheDir = "$env:VALUE_STEPS_SCCACHE_PATHS_OUTPUTS_CACHE_DIR"
          $sccacheExe = Join-Path $toolDir "sccache.exe"
          $ProgressPreference = "SilentlyContinue"

          if (-not (Test-Path $sccacheExe)) {
            $archive = Join-Path $env:RUNNER_TEMP "sccache-$env:SCCACHE_VERSION.zip"
            $extractDir = Join-Path $env:RUNNER_TEMP "sccache-$env:SCCACHE_VERSION"
            $downloadUrl = "https://github.com/mozilla/sccache/releases/download/v$env:SCCACHE_VERSION/sccache-v$env:SCCACHE_VERSION-x86_64-pc-windows-msvc.zip"

            Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
            $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $env:SCCACHE_SHA256) {
              Write-Error "sccache archive checksum mismatch. Expected $env:SCCACHE_SHA256, got $actualHash."
              exit 1
            }

            Expand-Archive -Path $archive -DestinationPath $extractDir -Force
            $expandedSccache = Get-ChildItem -Path $extractDir -Filter "sccache.exe" -Recurse -File | Select-Object -First 1
            if (-not $expandedSccache) {
              Write-Error "sccache.exe was not found inside the downloaded archive."
              exit 1
            }

            New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
            Copy-Item -LiteralPath $expandedSccache.FullName -Destination $sccacheExe -Force
          }

          $sccacheVersion = (& $sccacheExe --version).Trim()
          if ($sccacheVersion -notmatch [regex]::Escape($env:SCCACHE_VERSION)) {
            Write-Error "Unexpected sccache version: expected $env:SCCACHE_VERSION, got $sccacheVersion."
            exit 1
          }

          "$env:VALUE_STEPS_SCCACHE_PATHS_OUTPUTS_TOOL_DIR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "RUSTC_WRAPPER=$sccacheExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCCACHE_CACHE_SIZE=2G" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCCACHE_DIR=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "sccache version: $sccacheVersion"
          "sccache cache hit: $env:VALUE_STEPS_SCCACHE_CACHE_OUTPUTS_CACHE_HIT"

      - name: Resolve cargo-audit cache directory
        id: cargo_audit_paths
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TOOL_CACHE "cargo-audit\$env:CARGO_AUDIT_VERSION"
          $binDir = Join-Path $toolDir "bin"

          "tool_dir=$toolDir" >> $env:GITHUB_OUTPUT
          "bin_dir=$binDir" >> $env:GITHUB_OUTPUT
          "cache_key=cargo-audit-$env:RUNNER_OS-$env:CARGO_AUDIT_VERSION" >> $env:GITHUB_OUTPUT

      - name: Cache cargo-audit binary
        id: cargo_audit_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cargo_audit_paths.outputs.tool_dir }}
          key: ${{ steps.cargo_audit_paths.outputs.cache_key }}

      - name: Add cargo-audit to PATH
        shell: pwsh
        env:
          VALUE_STEPS_CARGO_AUDIT_PATHS_OUTPUTS_BIN_DIR: ${{ steps.cargo_audit_paths.outputs.bin_dir }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VALUE_STEPS_CARGO_AUDIT_PATHS_OUTPUTS_BIN_DIR" | Out-Null
          "$env:VALUE_STEPS_CARGO_AUDIT_PATHS_OUTPUTS_BIN_DIR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Require Windows code signing configuration when requested
        if: env.WHISPR_DESKTOP_WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) { $missing += "WINDOWS_CERTIFICATE_PFX_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { $missing += "WINDOWS_CERTIFICATE_PASSWORD" }
          if ($env:WHISPR_DESKTOP_RELEASE_RING -eq "stable") {
            $certificateKind = ([string]$env:WHISPR_DESKTOP_WINDOWS_SIGNING_CERT_KIND).Trim().ToUpperInvariant()
            if ($certificateKind -notin @("OV", "EV")) {
              $missing += "WHISPR_DESKTOP_WINDOWS_SIGNING_CERT_KIND=OV|EV"
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Windows signing was requested but its certificate configuration is incomplete: $($missing -join ', ')."
            exit 1
          }

      - name: Require updater signing configuration when updater artifacts are requested
        if: needs.release-contract.outputs.enable_updater == 'true'
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WHISPR_DESKTOP_UPDATER_ENDPOINTS)) { $missing += "WHISPR_DESKTOP_UPDATER_ENDPOINTS" }
          if ([string]::IsNullOrWhiteSpace($env:WHISPR_DESKTOP_UPDATER_PUBLIC_KEY)) { $missing += "WHISPR_DESKTOP_UPDATER_PUBLIC_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { $missing += "TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { $missing += "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }

          if ($missing.Count -gt 0) {
            Write-Error "Updater artifacts require Ed25519 signing and an HTTPS updater endpoint: $($missing -join ', ')."
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Generate desktop production config
        run: pnpm --filter @wizards/desktop build:desktop:config

      - name: Validate generated desktop config and release operations
        run: pnpm --filter @wizards/desktop release:ops

      - name: Run desktop release script tests
        run: pnpm --filter @wizards/desktop test

      - name: Install cargo-audit
        if: steps.cargo_audit_cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        env:
          VALUE_STEPS_CARGO_AUDIT_PATHS_OUTPUTS_TOOL_DIR: ${{ steps.cargo_audit_paths.outputs.tool_dir }}
        run: |
          cargo install cargo-audit --version $env:CARGO_AUDIT_VERSION --locked --root "$env:VALUE_STEPS_CARGO_AUDIT_PATHS_OUTPUTS_TOOL_DIR" --force

      - name: Verify cargo-audit
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        env:
          VALUE_STEPS_CARGO_AUDIT_PATHS_OUTPUTS_BIN_DIR: ${{ steps.cargo_audit_paths.outputs.bin_dir }}
          VALUE_STEPS_CARGO_AUDIT_CACHE_OUTPUTS_CACHE_HIT: ${{ steps.cargo_audit_cache.outputs.cache-hit }}
        run: |
          $expectedBinDir = [IO.Path]::GetFullPath("$env:VALUE_STEPS_CARGO_AUDIT_PATHS_OUTPUTS_BIN_DIR")
          $cargoAudit = Get-Command cargo-audit -ErrorAction SilentlyContinue
          if (-not $cargoAudit) {
            Write-Error "cargo-audit was not found after cache restore/install."
            exit 1
          }

          $cargoAuditPath = [IO.Path]::GetFullPath($cargoAudit.Source)
          if (-not $cargoAuditPath.StartsWith($expectedBinDir, [StringComparison]::OrdinalIgnoreCase)) {
            Write-Error "cargo-audit resolved from an unexpected path. Expected under '$expectedBinDir', got '$cargoAuditPath'."
            exit 1
          }

          $currentVersion = (& $cargoAuditPath --version).Trim()
          $expectedVersionPattern = "(^|\s)$([regex]::Escape($env:CARGO_AUDIT_VERSION))(\s|$)"
          if ($currentVersion -notmatch $expectedVersionPattern) {
            Write-Error "Unexpected cargo-audit version: expected version token '$env:CARGO_AUDIT_VERSION', got '$currentVersion'."
            exit 1
          }

          "cargo-audit cache hit: $env:VALUE_STEPS_CARGO_AUDIT_CACHE_OUTPUTS_CACHE_HIT"
          "cargo-audit version: $currentVersion"
          "cargo-audit path: $cargoAuditPath"

      - name: Run cargo audit and summarize
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          $cargoAuditJson = Join-Path $env:RUNNER_TEMP "desktop-cargo-audit.json"
          $cargoAuditSummary = Join-Path $env:RUNNER_TEMP "desktop-cargo-audit-summary.json"

          cargo audit --json | Out-File -FilePath $cargoAuditJson -Encoding utf8
          $auditExitCode = $LASTEXITCODE

          $srcTauriPath = Get-Location
          Set-Location $env:GITHUB_WORKSPACE
          pnpm --filter @wizards/desktop release:cargo-audit-summary -- `
            --input "$cargoAuditJson" `
            --out "$cargoAuditSummary"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $srcTauriPath

          if ($auditExitCode -ne 0) {
            Write-Error "cargo audit reported vulnerability findings. See desktop-cargo-audit-summary.json in release artifacts."
            exit $auditExitCode
          }

      - name: Build desktop app
        run: pnpm --filter @wizards/desktop build:desktop

      - name: Sign desktop artifacts without updater bundle signing
        if: env.WHISPR_DESKTOP_WINDOWS_SIGNING_ENABLED == 'true' && needs.release-contract.outputs.enable_updater != 'true'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "whispr-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))

            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $signtool) {
              throw "signtool.exe was not found on the Windows runner."
            }

            $artifacts = @(
              Get-ChildItem "apps\desktop\src-tauri\target\release" -Filter "*.exe" -File -ErrorAction SilentlyContinue
              Get-ChildItem "apps\desktop\src-tauri\target\release\bundle" -Include "*.exe", "*.msi" -Recurse -File -ErrorAction SilentlyContinue
            )

            if ($artifacts.Count -eq 0) {
              throw "No desktop artifacts were found to sign."
            }

            foreach ($artifact in $artifacts) {
              & $signtool.FullName sign /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $artifact.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed for $($artifact.FullName) with exit code $LASTEXITCODE."
              }
            }
          } finally {
            if (Test-Path $certificatePath) {
              Remove-Item $certificatePath -Force
            }
          }

      - name: Create desktop build metadata
        shell: pwsh
        env:
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION: ${{ needs.release-contract.outputs.version }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING: ${{ needs.release-contract.outputs.release_ring }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_ENABLE_UPDATER: ${{ needs.release-contract.outputs.enable_updater }}
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\src-tauri\target\release\bundle\nsis"

          pnpm --filter @wizards/desktop release:artifacts -- `
            --version "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION" `
            --ring "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING" `
            --updater-enabled "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_ENABLE_UPDATER" `
            --artifact-dir "$artifactDir" `
            --out "$env:RUNNER_TEMP\desktop-build-metadata.json"

      - name: Generate and validate updater manifest evidence
        if: needs.release-contract.outputs.enable_updater == 'true'
        shell: pwsh
        env:
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING: ${{ needs.release-contract.outputs.release_ring }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION: ${{ needs.release-contract.outputs.version }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_BASE_URL: ${{ needs.release-contract.outputs.updater_base_url }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG: ${{ needs.release-contract.outputs.release_tag }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_WEB_URL: ${{ needs.release-contract.outputs.web_url }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL: ${{ needs.release-contract.outputs.updater_manifest_url }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $metadataPath = Join-Path $env:RUNNER_TEMP "desktop-build-metadata.json"
          $metadata = Get-Content $metadataPath -Raw | ConvertFrom-Json
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\src-tauri\target\release\bundle\nsis"
          $dependencyAuditPath = Join-Path $env:RUNNER_TEMP "desktop-cargo-audit-summary.json"
          $evidenceDir = Join-Path $env:RUNNER_TEMP "desktop-release-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null

          $installerPath = Join-Path $artifactDir $metadata.artifacts.installer.filename
          if (-not $metadata.artifacts.signature -or [string]::IsNullOrWhiteSpace($metadata.artifacts.signature.filename)) {
            Write-Error "Updater release evidence requires a generated .sig file."
            exit 1
          }

          $signaturePath = Join-Path $artifactDir $metadata.artifacts.signature.filename
          $manifestPath = Join-Path $artifactDir "latest.json"
          $notes = "Whispr Desktop $env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING release $env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION."

          pnpm --filter @wizards/desktop release:manifest -- `
            --artifact "$installerPath" `
            --signature "$signaturePath" `
            --base-url "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_BASE_URL" `
            --version "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION" `
            --notes "$notes" `
            --out "$manifestPath"

          pnpm --filter @wizards/desktop release:validate-manifest -- `
            --manifest "$manifestPath" `
            --artifact "$installerPath" `
            --signature "$signaturePath" `
            --ring "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING" `
            --release-tag "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG" `
            --expected-version "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION"

          $auditPath = Join-Path $evidenceDir "desktop-release-audit-$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION-$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING.json"

          pnpm --filter @wizards/desktop release:audit -- `
            --ring "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING" `
            --web-url "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_WEB_URL" `
            --manifest "$manifestPath" `
            --manifest-url "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL" `
            --artifact "$installerPath" `
            --dependency-audit "$dependencyAuditPath" `
            --signature "$signaturePath" `
            --release-tag "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG" `
            --expected-version "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION" `
            --require-manifest `
            --out "$auditPath"

          pnpm --filter @wizards/desktop release:promotion -- `
            --ring "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING" `
            --web-url "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_WEB_URL" `
            --manifest "$manifestPath" `
            --manifest-url "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL" `
            --artifact "$installerPath" `
            --dependency-audit "$dependencyAuditPath" `
            --signature "$signaturePath" `
            --release-tag "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG" `
            --expected-version "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION" `
            --out-dir "$evidenceDir"

      - name: Capture sccache stats
        if: always()
        shell: pwsh
        run: |
          $statsPath = Join-Path $env:RUNNER_TEMP "desktop-sccache-stats.txt"

          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats | Tee-Object -FilePath $statsPath
            sccache --stop-server
            if ($LASTEXITCODE -ne 0) {
              $message = "sccache stop-server returned exit code $LASTEXITCODE. This is non-fatal when no compiler server was started."
              Write-Warning $message
              Add-Content -Path $statsPath -Value ""
              Add-Content -Path $statsPath -Value $message
              $global:LASTEXITCODE = 0
            }
          } else {
            "sccache was not available on PATH." | Tee-Object -FilePath $statsPath
          }

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: desktop-build-${{ needs.release-contract.outputs.release_ring }}-${{ needs.release-contract.outputs.version }}-windows
          path: |
            ${{ runner.temp }}/desktop-build-metadata.json
            ${{ runner.temp }}/desktop-cargo-audit-summary.json
            ${{ runner.temp }}/desktop-sccache-stats.txt
            ${{ runner.temp }}/desktop-release-evidence/**
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.json
          retention-days: 14

      - name: Write desktop build summary
        shell: pwsh
        env:
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL: ${{ needs.release-contract.outputs.updater_manifest_url }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $metadataPath = Join-Path $env:RUNNER_TEMP "desktop-build-metadata.json"
          $metadata = Get-Content $metadataPath -Raw | ConvertFrom-Json
          $dependencyAuditPath = Join-Path $env:RUNNER_TEMP "desktop-cargo-audit-summary.json"
          $dependencyAudit = if (Test-Path $dependencyAuditPath) {
            Get-Content $dependencyAuditPath -Raw | ConvertFrom-Json
          } else {
            $null
          }
          $dependencyVulnerabilities = if ($dependencyAudit) { $dependencyAudit.vulnerabilities.count } else { "not recorded" }
          $dependencyWarnings = if ($dependencyAudit) { $dependencyAudit.warnings.count } else { "not recorded" }
          $signatureFile = if ($metadata.artifacts.signature) { $metadata.artifacts.signature.filename } else { "not generated" }
          $manifestUrl = "$env:VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL"
          if ([string]::IsNullOrWhiteSpace($manifestUrl)) {
            $manifestUrl = "not requested"
          }

          @"
          ### Desktop Windows build

          | Field | Value |
          | --- | --- |
          | Ring | ``$($metadata.releaseRing)`` |
          | Version | ``$($metadata.version)`` |
          | Platform | ``$($metadata.platform)`` |
          | Updater artifacts | ``$($metadata.updaterEnabled)`` |
          | Installer | ``$($metadata.artifacts.installer.filename)`` |
          | Installer SHA-256 | ``$($metadata.artifacts.installer.sha256)`` |
          | Signature | ``$signatureFile`` |
          | Manifest URL | ``$manifestUrl`` |
          | Dependency vulnerabilities | ``$dependencyVulnerabilities`` |
          | Dependency warnings | ``$dependencyWarnings`` |
          "@ >> $env:GITHUB_STEP_SUMMARY

  publish-release:
    name: Publish desktop release artifacts
    runs-on: ubuntu-24.04
    needs:
      - release-contract
      - build-windows
    if: needs.release-contract.outputs.publish_r2 == 'true' || needs.release-contract.outputs.publish_github_release == 'true'
    timeout-minutes: 25
    environment: desktop-${{ needs.release-contract.outputs.release_ring }}
    permissions:
      contents: write

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download desktop build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-build-${{ needs.release-contract.outputs.release_ring }}-${{ needs.release-contract.outputs.version }}-windows
          path: ${{ runner.temp }}/desktop-build

      - name: Locate publish assets
        id: assets
        shell: bash
        env:
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION: ${{ needs.release-contract.outputs.version }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING: ${{ needs.release-contract.outputs.release_ring }}
        run: |
          set -euo pipefail

          root="$RUNNER_TEMP/desktop-build"
          version="${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION}"
          ring="${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING}"

          find_one() {
            local pattern="$1"
            local label="$2"
            local result
            result="$(find "$root" -type f -name "$pattern" | sort | head -n 1)"
            if [[ -z "$result" ]]; then
              echo "::error::Missing desktop publish asset: $label ($pattern)"
              exit 1
            fi
            printf '%s' "$result"
          }

          installer="$(find_one "Whispr_${version}_*setup.exe" "installer")"
          installer_name="$(basename "$installer")"
          signature="$(find_one "${installer_name}.sig" "signature")"
          manifest="$(find_one "latest.json" "manifest")"
          metadata="$(find_one "desktop-build-metadata.json" "build metadata")"
          audit="$(find_one "desktop-release-audit-${version}-${ring}.json" "release audit")"
          dependency_audit="$(find_one "desktop-cargo-audit-summary.json" "dependency audit")"
          promotion_json="$(find_one "desktop-release-promotion-${version}-${ring}.json" "promotion JSON")"
          promotion_md="$(find_one "desktop-release-promotion-${version}-${ring}.md" "promotion Markdown")"

          {
            echo "installer=$installer"
            echo "signature=$signature"
            echo "manifest=$manifest"
            echo "metadata=$metadata"
            echo "audit=$audit"
            echo "dependency_audit=$dependency_audit"
            echo "promotion_json=$promotion_json"
            echo "promotion_md=$promotion_md"
          } >> "$GITHUB_OUTPUT"

      - name: Create desktop publish plan
        id: publish_plan
        shell: bash
        env:
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING: ${{ needs.release-contract.outputs.release_ring }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION: ${{ needs.release-contract.outputs.version }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG: ${{ needs.release-contract.outputs.release_tag }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_WEB_URL: ${{ needs.release-contract.outputs.web_url }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_BASE_URL: ${{ needs.release-contract.outputs.updater_base_url }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_PUBLISH_R2: ${{ needs.release-contract.outputs.publish_r2 }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_PUBLISH_GITHUB_RELEASE: ${{ needs.release-contract.outputs.publish_github_release }}
          VALUE_STEPS_ASSETS_OUTPUTS_INSTALLER: ${{ steps.assets.outputs.installer }}
          VALUE_STEPS_ASSETS_OUTPUTS_MANIFEST: ${{ steps.assets.outputs.manifest }}
          VALUE_STEPS_ASSETS_OUTPUTS_SIGNATURE: ${{ steps.assets.outputs.signature }}
          VALUE_STEPS_ASSETS_OUTPUTS_METADATA: ${{ steps.assets.outputs.metadata }}
          VALUE_STEPS_ASSETS_OUTPUTS_AUDIT: ${{ steps.assets.outputs.audit }}
          VALUE_STEPS_ASSETS_OUTPUTS_PROMOTION_JSON: ${{ steps.assets.outputs.promotion_json }}
          VALUE_STEPS_ASSETS_OUTPUTS_PROMOTION_MD: ${{ steps.assets.outputs.promotion_md }}
        run: |
          set -euo pipefail

          output_path="$RUNNER_TEMP/desktop-publish-plan.json"

          pnpm --filter @wizards/desktop release:publish-plan -- \
            --ring "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING}" \
            --version "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION}" \
            --release-tag "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG}" \
            --web-url "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_WEB_URL}" \
            --updater-base-url "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_BASE_URL}" \
            --publish-r2 "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_PUBLISH_R2}" \
            --publish-github-release "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_PUBLISH_GITHUB_RELEASE}" \
            --artifact "${VALUE_STEPS_ASSETS_OUTPUTS_INSTALLER}" \
            --manifest "${VALUE_STEPS_ASSETS_OUTPUTS_MANIFEST}" \
            --signature "${VALUE_STEPS_ASSETS_OUTPUTS_SIGNATURE}" \
            --metadata "${VALUE_STEPS_ASSETS_OUTPUTS_METADATA}" \
            --audit "${VALUE_STEPS_ASSETS_OUTPUTS_AUDIT}" \
            --promotion-json "${VALUE_STEPS_ASSETS_OUTPUTS_PROMOTION_JSON}" \
            --promotion-md "${VALUE_STEPS_ASSETS_OUTPUTS_PROMOTION_MD}" \
            --out "$output_path"

          echo "path=$output_path" >> "$GITHUB_OUTPUT"

      - name: Require R2 publishing secrets
        if: needs.release-contract.outputs.publish_r2 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${R2_ACCESS_KEY_ID:-}" ]] || missing+=("R2_ACCESS_KEY_ID")
          [[ -n "${R2_SECRET_ACCESS_KEY:-}" ]] || missing+=("R2_SECRET_ACCESS_KEY")
          [[ -n "${R2_BUCKET:-}" ]] || missing+=("R2_BUCKET")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::R2 publishing is enabled but required secrets are missing: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Install verified job-local AWS CLI
        if: needs.release-contract.outputs.publish_r2 == 'true'
        run: bash .github/scripts/setup-aws-cli.sh

      - name: Publish updater artifacts to Cloudflare R2
        if: needs.release-contract.outputs.publish_r2 == 'true'
        shell: bash
        env:
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING: ${{ needs.release-contract.outputs.release_ring }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG: ${{ needs.release-contract.outputs.release_tag }}
          VALUE_STEPS_ASSETS_OUTPUTS_INSTALLER: ${{ steps.assets.outputs.installer }}
          VALUE_STEPS_ASSETS_OUTPUTS_SIGNATURE: ${{ steps.assets.outputs.signature }}
          VALUE_STEPS_ASSETS_OUTPUTS_MANIFEST: ${{ steps.assets.outputs.manifest }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          endpoint_url="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ring="${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING}"
          release_tag="${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG}"
          installer="${VALUE_STEPS_ASSETS_OUTPUTS_INSTALLER}"
          signature="${VALUE_STEPS_ASSETS_OUTPUTS_SIGNATURE}"
          manifest="${VALUE_STEPS_ASSETS_OUTPUTS_MANIFEST}"
          installer_name="$(basename "$installer")"
          signature_name="$(basename "$signature")"
          release_prefix="desktop/${ring}/releases/${release_tag}"

          aws --endpoint-url "$endpoint_url" s3api put-object --bucket "$R2_BUCKET" --key "${release_prefix}/${installer_name}" --body "$installer" --if-none-match "*" \
            --content-type "application/vnd.microsoft.portable-executable" \
            --cache-control "public, max-age=31536000, immutable"

          aws --endpoint-url "$endpoint_url" s3api put-object --bucket "$R2_BUCKET" --key "${release_prefix}/${signature_name}" --body "$signature" --if-none-match "*" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"

          aws --endpoint-url "$endpoint_url" s3api put-object --bucket "$R2_BUCKET" --key "${release_prefix}/latest.json" --body "$manifest" --if-none-match "*" \
            --content-type "application/json" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Validate remote updater feed
        if: needs.release-contract.outputs.publish_r2 == 'true'
        shell: bash
        env:
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL: ${{ needs.release-contract.outputs.updater_base_url }}latest.json
          VALUE_STEPS_ASSETS_OUTPUTS_INSTALLER: ${{ steps.assets.outputs.installer }}
          VALUE_STEPS_ASSETS_OUTPUTS_SIGNATURE: ${{ steps.assets.outputs.signature }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING: ${{ needs.release-contract.outputs.release_ring }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG: ${{ needs.release-contract.outputs.release_tag }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION: ${{ needs.release-contract.outputs.version }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if pnpm --filter @wizards/desktop release:validate-manifest -- \
              --manifest "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL}" \
              --artifact "${VALUE_STEPS_ASSETS_OUTPUTS_INSTALLER}" \
              --signature "${VALUE_STEPS_ASSETS_OUTPUTS_SIGNATURE}" \
              --ring "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING}" \
              --release-tag "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG}" \
              --expected-version "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION}" \
              --check-artifact-url; then
              exit 0
            fi

            if [[ "$attempt" == "5" ]]; then
              echo "::error::Remote updater feed validation failed after $attempt attempts."
              exit 1
            fi

            sleep $((attempt * 5))
          done

      - name: Publish GitHub Release
        if: needs.release-contract.outputs.publish_github_release == 'true'
        shell: bash
        env:
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG: ${{ needs.release-contract.outputs.release_tag }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION: ${{ needs.release-contract.outputs.version }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING: ${{ needs.release-contract.outputs.release_ring }}
          VALUE_STEPS_ASSETS_OUTPUTS_INSTALLER: ${{ steps.assets.outputs.installer }}
          VALUE_STEPS_ASSETS_OUTPUTS_MANIFEST: ${{ steps.assets.outputs.manifest }}
          VALUE_STEPS_ASSETS_OUTPUTS_SIGNATURE: ${{ steps.assets.outputs.signature }}
          VALUE_STEPS_ASSETS_OUTPUTS_METADATA: ${{ steps.assets.outputs.metadata }}
          VALUE_STEPS_ASSETS_OUTPUTS_AUDIT: ${{ steps.assets.outputs.audit }}
          VALUE_STEPS_ASSETS_OUTPUTS_DEPENDENCY_AUDIT: ${{ steps.assets.outputs.dependency_audit }}
          VALUE_STEPS_ASSETS_OUTPUTS_PROMOTION_JSON: ${{ steps.assets.outputs.promotion_json }}
          VALUE_STEPS_ASSETS_OUTPUTS_PROMOTION_MD: ${{ steps.assets.outputs.promotion_md }}
          VALUE_STEPS_PUBLISH_PLAN_OUTPUTS_PATH: ${{ steps.publish_plan.outputs.path }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_IS_PRERELEASE: ${{ needs.release-contract.outputs.is_prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG}"
          title="Whispr Desktop ${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION}"
          if [[ "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING}" != "stable" ]]; then
            title="$title ${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING}"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::GitHub Release already exists for $tag. Use a new release version/tag; published artifacts must remain immutable."
            exit 1
          fi

          args=(
            "$tag"
            "${VALUE_STEPS_ASSETS_OUTPUTS_INSTALLER}"
            "${VALUE_STEPS_ASSETS_OUTPUTS_MANIFEST}"
            "${VALUE_STEPS_ASSETS_OUTPUTS_SIGNATURE}"
            "${VALUE_STEPS_ASSETS_OUTPUTS_METADATA}"
            "${VALUE_STEPS_ASSETS_OUTPUTS_AUDIT}"
            "${VALUE_STEPS_ASSETS_OUTPUTS_DEPENDENCY_AUDIT}"
            "${VALUE_STEPS_ASSETS_OUTPUTS_PROMOTION_JSON}"
            "${VALUE_STEPS_ASSETS_OUTPUTS_PROMOTION_MD}"
            "${VALUE_STEPS_PUBLISH_PLAN_OUTPUTS_PATH}"
            --target "$GITHUB_SHA"
            --title "$title"
            --notes-file "${VALUE_STEPS_ASSETS_OUTPUTS_PROMOTION_MD}"
          )

          if [[ "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_IS_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

      - name: Upload desktop publish evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: desktop-publish-evidence-${{ needs.release-contract.outputs.release_ring }}-${{ needs.release-contract.outputs.version }}
          path: ${{ steps.publish_plan.outputs.path }}
          retention-days: 30

      - name: Write publish summary
        shell: bash
        env:
          VALUE_STEPS_ASSETS_OUTPUTS_INSTALLER: ${{ steps.assets.outputs.installer }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_BASE_URL: ${{ needs.release-contract.outputs.updater_base_url }}
          VALUE_STEPS_ASSETS_OUTPUTS_METADATA: ${{ steps.assets.outputs.metadata }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING: ${{ needs.release-contract.outputs.release_ring }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION: ${{ needs.release-contract.outputs.version }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG: ${{ needs.release-contract.outputs.release_tag }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_PUBLISH_R2: ${{ needs.release-contract.outputs.publish_r2 }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_PUBLISH_GITHUB_RELEASE: ${{ needs.release-contract.outputs.publish_github_release }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL: ${{ needs.release-contract.outputs.updater_manifest_url }}
        run: |
          set -euo pipefail

          artifact_name="$(basename "${VALUE_STEPS_ASSETS_OUTPUTS_INSTALLER}")"
          artifact_url="${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_BASE_URL}${artifact_name}"
          artifact_sha="$(node -e "const fs = require('fs'); const metadata = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(metadata.artifacts.installer.sha256);" "${VALUE_STEPS_ASSETS_OUTPUTS_METADATA}")"
          artifact_size="$(node -e "const fs = require('fs'); const metadata = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(metadata.artifacts.installer.sizeBytes);" "${VALUE_STEPS_ASSETS_OUTPUTS_METADATA}")"

          {
            echo "### Desktop release publishing"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Ring | \`${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING}\` |"
            echo "| Version | \`${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION}\` |"
            echo "| Tag | \`${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_TAG}\` |"
            echo "| R2 | \`${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_PUBLISH_R2}\` |"
            echo "| GitHub Release | \`${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_PUBLISH_GITHUB_RELEASE}\` |"
            echo "| Manifest | \`${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL}\` |"
            echo "| Artifact URL | \`$artifact_url\` |"
            echo "| Artifact SHA-256 | \`$artifact_sha\` |"
            echo "| Artifact size | \`$artifact_size bytes\` |"
            echo ""
            echo "#### Manual QA after finalize-release succeeds"
            echo ""
            echo "- Install the previous desktop version for \`${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING}\`."
            echo "- Confirm the updater card sees \`${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_VERSION}\` from \`${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_UPDATER_MANIFEST_URL}\`."
            echo "- Click Download and restart, then confirm Settings -> About reports the new desktop runtime version."
            echo "- Run launch, auth restore, close-to-tray, voice, overlay, notification, and shortcut smoke checks."
            echo ""
            echo "#### Performance evidence"
            echo ""
            echo "- [ ] \`warm-start\` <= 2000ms"
            echo "- [ ] \`idle-memory\` <= 220MB"
            echo "- [ ] \`updater-check-install\` succeeds"
            echo "- [ ] \`overlay-cpu\` <= 3% average"
            echo "- [ ] \`shortcut-latency\` <= 50ms p95"
            echo ""
            echo "#### Rollback"
            echo ""
            echo "Withdraw the release from /admin/releases to stop download and update offers."
            echo "Publish a higher corrective version for installed clients; native downgrades are not automatic."
            echo "The legacy latest.json URL redirects to the registry. Do not overwrite a mutable R2 manifest."
          } >> "$GITHUB_STEP_SUMMARY"

  finalize-release:
    name: Publish verified desktop release and download catalog
    needs: [release-contract, publish-release]
    if: needs.release-contract.outputs.publish_r2 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: desktop-${{ needs.release-contract.outputs.release_ring }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-build-${{ needs.release-contract.outputs.release_ring }}-${{ needs.release-contract.outputs.version }}-windows
          path: ${{ runner.temp }}/desktop-build
      - name: Prepare immutable publication manifest
        run: node scripts/releases/prepare-publication.mjs desktop "$RUNNER_TEMP/desktop-publication.json" "$RUNNER_TEMP/desktop-build"
      - name: Verify public bytes and finalize publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/releases/publish-release.mjs "$RUNNER_TEMP/desktop-publication.json"

  timing-summary:
    name: Summarize desktop release timing
    runs-on: ubuntu-24.04
    needs:
      - release-contract
      - build-windows
      - publish-release
    if: always()
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Generate desktop release timing summary
        env:
          VALUE_GITHUB_REPOSITORY: ${{ github.repository }}
          VALUE_GITHUB_RUN_ID: ${{ github.run_id }}
          VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING_INPUTS_RING: ${{ needs.release-contract.outputs.release_ring || inputs.ring }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node apps/desktop/scripts/desktop-release-timing-summary.mjs \
            --repo "${VALUE_GITHUB_REPOSITORY}" \
            --run-id "${VALUE_GITHUB_RUN_ID}" \
            --ring "${VALUE_NEEDS_RELEASE_CONTRACT_OUTPUTS_RELEASE_RING_INPUTS_RING}" \
            --out "$RUNNER_TEMP/desktop-release-timing.json"

      - name: Upload desktop release timing evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: desktop-release-timing-${{ needs.release-contract.outputs.release_ring || inputs.ring }}-${{ needs.release-contract.outputs.version || inputs.version }}
          path: ${{ runner.temp }}/desktop-release-timing.json
          retention-days: 30
