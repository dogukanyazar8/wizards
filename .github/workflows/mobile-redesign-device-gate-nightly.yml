name: Mobile Redesign Device Gate (UAT)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mobile-redesign-device-gate-uat
  cancel-in-progress: false

jobs:
  device-visual-gate:
    name: Device visual gate (UAT evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout UAT evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: uat

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run committed device evidence gate
        id: device_gate
        env:
          WHISPR_DEVICE_CAPTURE_DIRECTORY: artifacts/redesign
        run: pnpm --filter @wizards/mobile visual:gate

      - name: Upload device visual gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: mobile-redesign-device-gate-uat-${{ github.run_id }}
          path: artifacts/redesign
          retention-days: 30

      - name: Notify UAT visual gate failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = "Mobile UAT device visual gate is failing";
            const marker = "<!-- mobile-redesign-device-gate -->";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && issue.body?.includes(marker));
            const body = `${marker}\nThe committed UAT device-capture evidence failed on the uat ref. Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
