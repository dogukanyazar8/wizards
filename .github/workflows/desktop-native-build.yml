name: Desktop Native Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/desktop-native-build.yml"
  push:
    branches:
      - main
      - staging
      - uat
    paths:
      - "apps/desktop/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/desktop-native-build.yml"

concurrency:
  group: desktop-native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-build:
    name: Unsigned Windows build
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      TAURI_WEB_URL: https://whispr.team
      TURBO_TELEMETRY_DISABLED: "1"
      WHISPR_DESKTOP_RELEASE_RING: uat
      WHISPR_DESKTOP_UPDATER_ENABLED: "false"
      WHISPR_DESKTOP_WINDOWS_SIGNING_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Tauri binary
        run: pnpm --filter @wizards/desktop build:desktop -- --no-bundle

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -LiteralPath "apps/desktop/src-tauri/target/release" -Filter "whispr-desktop.exe" -File -ErrorAction SilentlyContinue
          if ($null -eq $artifact) {
            throw "Unsigned Tauri build did not produce whispr-desktop.exe."
          }
